<!-- Marca vectorial propia: sin fuentes, imágenes remotas ni scripts para que funcione offline y escale sin perder nitidez. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Ronin IA</title>
  <desc id="desc">Emblema de un ronin estilizado dentro de un círculo cian y violeta.</desc>
  <defs>
    <!-- El gradiente cian-violeta es el acento de marca compartido con la interfaz. -->
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#22d3ee"/><stop offset=".52" stop-color="#3b82f6"/><stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff"/><stop offset="1" stop-color="#76e4ff"/>
    </linearGradient>
    <radialGradient id="core">
      <stop stop-color="#102b48"/><stop offset="1" stop-color="#07111f"/>
    </radialGradient>
  </defs>
  <!-- Aro abierto: su silueta sugiere movimiento sin complicar la lectura a 24 px. -->
  <circle cx="64" cy="64" r="57" fill="url(#core)" stroke="url(#edge)" stroke-width="5" stroke-dasharray="306 28" transform="rotate(-28 64 64)"/>
  <path d="M21 45 87 20 109 29 73 37 43 56Z" fill="url(#edge)"/>
  <path d="M35 47 87 31 73 41 48 57Z" fill="#07111f"/>
  <!-- La katana queda separada del rostro para mantener contraste en tamaños pequeños. -->
  <path d="M35 49 14 20" fill="none" stroke="url(#steel)" stroke-width="5" stroke-linecap="round"/>
  <path d="m31 17 5 7" fill="none" stroke="#22d3ee" stroke-width="7" stroke-linecap="round"/>
  <!-- Rostro y pañuelo simplificados para conservar una silueta reconocible como icono. -->
  <path d="M39 51 73 45 91 56 85 72 98 95 78 105 62 86 48 95 34 82 37 67Z" fill="#0b1d33" stroke="#22d3ee" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="m44 63 27-7 11 9-14 5-15 2Z" fill="#eafaff"/>
  <path d="m44 77 18-3 11 10-11-2-11 8" fill="none" stroke="#a855f7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m77 44 19-6-11 13Z" fill="#a855f7"/>
  <!-- Trazo inferior: remata el emblema y repite el gradiente de la identidad visual. -->
  <path d="M31 98Q62 116 91 93" fill="none" stroke="url(#edge)" stroke-width="3" stroke-linecap="round"/>
</svg>
