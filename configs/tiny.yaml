profile: tiny
model:
  vocab_size: 256
  context_length: 128
  n_layers: 2
  n_heads: 4
  d_model: 128
  dropout: 0.0
  bias: false
training:
  batch_size: 4
  gradient_accumulation_steps: 1
  learning_rate: 0.0003
  min_learning_rate: 0.00003
  weight_decay: 0.1
  warmup_steps: 10
  max_steps: 100
  grad_clip_norm: 1.0
  seed: 1337
  precision: auto
  checkpoint_every: 50
