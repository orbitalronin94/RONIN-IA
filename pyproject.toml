[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ronin-ia"
version = "0.1.0"
description = "Modelo de lenguaje RONIN entrenado desde inicialización aleatoria."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Colaboradores de RONIN-IA" }]
dependencies = [
  "torch>=2.2",
  "numpy>=1.26",
  "PyYAML>=6.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]
tokenizer = ["tokenizers>=0.19"]
monitoring = ["tensorboard>=2.16"]
teachers = ["transformers==4.53.3", "huggingface_hub==0.36.0", "safetensors>=0.4"]
benchmarks = ["datasets==3.6.0", "huggingface_hub==0.36.0"]

[project.scripts]
ronin = "ronin.cli:main"

[tool.setuptools.packages.find]
include = ["ronin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
