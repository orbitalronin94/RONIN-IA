[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ronin-ia"
version = "0.1.0"
description = "Modelo de lenguaje RONIN entrenado desde inicialización aleatoria."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Colaboradores de RONIN-IA" }]
dependencies = [
  "torch>=2.2",
  "numpy>=1.26",
  "PyYAML>=6.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]
tokenizer = ["tokenizers>=0.19", "sentencepiece>=0.2"]
monitoring = ["tensorboard>=2.16"]
teachers = ["transformers==4.53.3", "huggingface_hub==0.36.0", "safetensors>=0.4", "accelerate==1.3.0"]
benchmarks = ["datasets==3.6.0", "huggingface_hub==0.36.0", "evaluate>=0.4", "scikit-learn>=1.5", "scipy>=1.13"]

math = ["sympy>=1.13", "scipy>=1.13", "mpmath>=1.3"]
logic = ["z3-solver>=4.13", "networkx>=3.3"]
statistics = ["scikit-learn>=1.5", "statsmodels>=0.14", "scipy>=1.13"]
corpus = ["datasets==3.6.0", "huggingface_hub==0.36.0", "pyarrow>=17", "polars>=1.5", "orjson>=3.10"]
books = ["pypdf>=5", "PyMuPDF>=1.24", "lxml>=5", "beautifulsoup4>=4.12"]
all-technical = [
  "sympy>=1.13", "scipy>=1.13", "mpmath>=1.3", "z3-solver>=4.13",
  "networkx>=3.3", "scikit-learn>=1.5", "statsmodels>=0.14", "evaluate>=0.4",
  "datasets==3.6.0", "huggingface_hub==0.36.0", "pyarrow>=17", "polars>=1.5",
  "orjson>=3.10", "sentencepiece>=0.2", "accelerate==1.3.0", "pypdf>=5",
  "PyMuPDF>=1.24", "lxml>=5", "beautifulsoup4>=4.12", "safetensors>=0.4"
]

[project.scripts]
ronin = "ronin.cli:main"

[tool.setuptools.packages.find]
include = ["ronin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ronin", "scripts"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
