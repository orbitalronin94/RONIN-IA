name: Link to RONIN run ledger
description: Add a direct link to the central run ledger to the workflow summary.
runs:
  using: composite
  steps:
    - name: Link run ledger
      shell: bash
      run: |
        echo "## Trazabilidad de ejecución" >> "$GITHUB_STEP_SUMMARY"
        echo "Esta ejecución queda registrada en el [Libro de runs de RONIN](https://github.com/$GITHUB_REPOSITORY/blob/main/docs/RUNS.md)." >> "$GITHUB_STEP_SUMMARY"
