name: Ingest GovEasy Spanish administration candidate

on:
  push:
    branches: [main]
    paths:
      - "scripts/ingest_goveasy_candidate.py"
      - ".github/workflows/ingest-goveasy-candidate.yml"
  workflow_dispatch:
  schedule:
    - cron: "19 5 9 * *"

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Acquire public snapshot and generate checksums
        run: python scripts/ingest_goveasy_candidate.py
      - name: Validate candidate rights evidence shape
        run: python scripts/validate_rights_registry.py --record artifacts/goveasy/rights-record.candidate.json
      - uses: actions/upload-artifact@v6
        with:
          name: ronin-goveasy-spanish-administration-candidate
          path: artifacts/goveasy/
          if-no-files-found: error
          retention-days: 90
