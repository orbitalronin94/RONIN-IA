name: Ingerir candidato UN Parallel Corpus en-es

on:
  push:
    paths:
      - ".github/workflows/ingest-un-parallel-en-es.yml"
      - "scripts/prepare_un_parallel_candidate.py"
      - "data/datasets/candidates/un-parallel-corpus-v1/README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ronin-un-parallel-en-es-candidate
  cancel-in-progress: false

jobs:
  download-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout RONIN
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar descargador público
        run: python -m pip install --upgrade gdown

      - name: Descargar las dos partes del bitexto oficial (espejo de transporte)
        run: |
          mkdir -p incoming/un-en-es
          gdown --id 1WFjXnj0i2yhubmFJFAhZ4-Ap4YHh-1p5 -O incoming/un-en-es/UNv1.0.en-es.tar.gz.00
          gdown --id 1I-uE0On0l33kbi23qxSMKl5nPzqVE4Wj -O incoming/un-en-es/UNv1.0.en-es.tar.gz.01
          test -s incoming/un-en-es/UNv1.0.en-es.tar.gz.00
          test -s incoming/un-en-es/UNv1.0.en-es.tar.gz.01
          cat incoming/un-en-es/UNv1.0.en-es.tar.gz.00 incoming/un-en-es/UNv1.0.en-es.tar.gz.01 > incoming/UNv1.0.en-es.tar.gz
          sha256sum incoming/UNv1.0.en-es.tar.gz | tee incoming/archive.sha256

      - name: Comprobar integridad gzip y extraer
        run: |
          gzip -t incoming/UNv1.0.en-es.tar.gz
          mkdir -p candidate/un-parallel-corpus-v1
          tar -xzf incoming/UNv1.0.en-es.tar.gz -C candidate/un-parallel-corpus-v1
          find candidate/un-parallel-corpus-v1 -type f -maxdepth 5 -print

      - name: Validar UTF-8, componentes y alineación de líneas
        run: |
          python scripts/prepare_un_parallel_candidate.py --root candidate/un-parallel-corpus-v1

      - name: Publicar payload candidato y manifiesto
        uses: actions/upload-artifact@v4
        with:
          name: ronin-un-parallel-corpus-en-es-candidate
          path: |
            candidate/un-parallel-corpus-v1/
            incoming/archive.sha256
          if-no-files-found: error
          compression-level: 1
          retention-days: 90
