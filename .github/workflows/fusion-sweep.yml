name: Exhaustive bounded fusion sweep

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'scripts/sweep_fusions.py'
      - 'scripts/benchmark_merge_vs_base.py'
      - '.github/workflows/fusion-sweep.yml'

permissions:
  contents: read

concurrency:
  group: ronin-fusion-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      checkpoint_exists: ${{ steps.result.outputs.checkpoint_exists }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU inference dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch transformers safetensors accelerate huggingface_hub
      - name: Restore fusion sweep progress
        id: fusion-cache
        uses: actions/cache/restore@v4
        with:
          path: fusion-sweep-results/
          key: ronin-fusion-progress-${{ github.ref_name }}-${{ hashFiles('scripts/sweep_fusions.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ronin-fusion-progress-${{ github.ref_name }}-${{ hashFiles('scripts/sweep_fusions.py') }}-
      - name: Sweep or resume eligible candidate combinations
        timeout-minutes: 340
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: python scripts/sweep_fusions.py --resume
      - name: Save fusion sweep progress for the next run\n        if: always()\n        uses: actions/cache/save@v4\n        with:\n          path: fusion-sweep-results/\n          key: ronin-fusion-progress-${{ github.ref_name }}-${{ hashFiles('scripts/sweep_fusions.py') }}-${{ github.run_id }}-${{ github.run_attempt }}\n      - name: Detect whether a candidate checkpoint was exported
        id: result
        if: always()
        shell: bash
        run: |
          if [ -d fusion-sweep-results/ronin-fused-checkpoint ] && [ -f fusion-sweep-results/sweep-report.json ]; then
            echo "checkpoint_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "checkpoint_exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish sweep report and optional checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ronin-fusion-sweep-results
          path: fusion-sweep-results/
          if-no-files-found: warn
          retention-days: 30

  confirm-with-lm-eval:
    name: Confirm candidate against base (lm-evaluation-harness)
    needs: sweep
    if: needs.sweep.outputs.checkpoint_exists == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download sweep artifact
        uses: actions/download-artifact@v4
        with:
          name: ronin-fusion-sweep-results
          path: fusion-sweep-results
      - name: Install independent benchmark harness
        run: |
          python -m pip install --upgrade pip
          pip install lm-eval
      - name: Compare base and exported candidate on fixed tasks
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          python scripts/benchmark_merge_vs_base.py \
            --base-model Qwen/Qwen3-0.6B \
            --merged-model fusion-sweep-results/ronin-fused-checkpoint \
            --tasks arc_easy,hellaswag,truthfulqa_mc2,gsm8k \
            --limit 100 --num-fewshot 0 --batch-size 1 --seed 42 \
            --output-dir merge-validation-results
      - name: Publish independent benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ronin-merge-validation
          path: merge-validation-results/
          if-no-files-found: warn
          retention-days: 30
