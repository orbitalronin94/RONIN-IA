name: Exhaustive bounded fusion sweep

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'scripts/sweep_fusions.py'
      - '.github/workflows/fusion-sweep.yml'

permissions:
  contents: read

concurrency:
  group: ronin-fusion-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU inference dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch transformers safetensors accelerate huggingface_hub
      - name: Sweep all eligible candidate combinations
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: python scripts/sweep_fusions.py
      - name: Publish sweep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ronin-fusion-sweep-results
          path: fusion-sweep-results/sweep-report.json
          if-no-files-found: warn
          retention-days: 30
