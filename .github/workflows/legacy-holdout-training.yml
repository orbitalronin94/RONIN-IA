name: RONIN — entrenamiento legacy 2000 + holdout intacto antes/después

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/legacy-holdout-training.yml"
  workflow_dispatch:
    inputs:
      steps:
        description: Pasos de entrenamiento (1-3000)
        required: true
        default: "2000"
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: ronin-legacy-holdout-training
  cancel-in-progress: true

jobs:
  train-and-evaluate:
    if: false # Disabled: global G-0 is FAIL; legacy corpus is not current Level A.
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      TRAIN_RUN_ID: "41926088900"
      PARTITIONS_RUN_ID: "41825919840"
      STEPS: ${{ inputs.steps || '2000' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validar presupuesto
        run: |
          if ! [[ "$STEPS" =~ ^[0-9]+$ ]] || [ "$STEPS" -lt 1 ] || [ "$STEPS" -gt 3000 ]; then
            echo "::error::STEPS debe estar entre 1 y 3000."
            exit 1
          fi

      - name: Descargar exclusivamente train admitido
        uses: actions/download-artifact@v6
        with:
          name: ronin-admitted-literature-es-v1-train
          path: incoming/train
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.TRAIN_RUN_ID }}

      - name: Descargar particiones oficiales para evaluar el holdout
        uses: actions/download-artifact@v6
        with:
          name: ronin-corpus-v2-particiones
          path: incoming/partitions
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.PARTITIONS_RUN_ID }}

      - name: Verificar hashes, separación y manifiesto antes de cualquier evaluación
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          train = Path("incoming/train/train.txt")
          test = Path("incoming/partitions/test.txt")
          validation = Path("incoming/partitions/validation.txt")
          manifest = json.loads(Path("incoming/train/dataset-manifest.json").read_text(encoding="utf-8"))
          expected = {
              train: "9cd5d7e83ed7690713add22c40fdf35eaf1fb88da3dafb748ca8201b08df9a78",
              validation: "ec1e32817f44b75f2983ab42179d677063b39728b108be3915be56289ceb95cf",
              test: "6ea09e2c0e4a2cc2753dfc91c841335600a9c6a954f3cf0ffb8b1d2336bfbd94",
          }
          for path, digest in expected.items():
              if not path.is_file():
                  raise SystemExit(f"Falta partición: {path}")
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              print(f"{path}: {actual} ({path.stat().st_size} bytes)")
              if actual != digest:
                  raise SystemExit(f"SHA-256 incorrecto: {path}")
          checks = {
              "dataset_id": manifest.get("dataset_id") == "ronin-spanish-public-domain-literature-v2",
              "training_eligible": manifest.get("training_eligible") is True,
              "holdouts_excluded": manifest.get("validation_test_included") is False,
              "documents": manifest.get("document_count") == 608,
              "train_bytes": manifest.get("train_bytes") == 140295523,
          }
          print(json.dumps(checks, indent=2))
          if not all(checks.values()):
              raise SystemExit("El manifiesto train no supera el gate.")
          PY

      - name: Instalar PyTorch CPU y dependencias RONIN
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          python -m pip install -e . --no-deps
          python -m pip install "numpy>=1.26" "PyYAML>=6.0" "tqdm>=4.66"

      - name: Crear checkpoint inicial reproducible
        run: |
          mkdir -p reports checkpoints
          python - <<'PY'
          import torch
          from ronin.config import get_profile
          from ronin.models.transformer import RoninLM
          from ronin.utils.repro import seed_everything
          config, _ = get_profile("tiny")
          seed_everything(1337)
          model = RoninLM(config)
          torch.save({"model": model.state_dict(), "step": 0}, "checkpoints/initial.pt")
          print(f"Checkpoint inicial; parámetros={model.parameter_count}")
          PY

      - name: Evaluación inicial — holdout oficial de 18 documentos
        run: |
          python scripts/evaluate_text.py \
            --checkpoint checkpoints/initial.pt \
            --validation-text incoming/partitions/test.txt \
            --profile tiny --batches 256 --batch-size 2 --seed 2026 --device cpu \
            --output reports/holdout-before.json
          python scripts/evaluate_domains.py \
            --checkpoint checkpoints/initial.pt \
            --dataset benchmarks/domains_v1.jsonl --profile tiny --device cpu \
            --output reports/domains-before.json

      - name: Entrenar 2000 pasos solo con los 608 documentos train
        run: |
          python scripts/train_text.py \
            --text incoming/train/train.txt \
            --profile tiny --steps "$STEPS" --seed 1337 \
            --device cpu --num-threads 2 \
            --checkpoints checkpoints/trained \
            --metrics-out reports/training-throughput.json

      - name: Evaluación final — exactamente el mismo holdout
        run: |
          checkpoint="checkpoints/trained/step-$(printf '%08d' "$STEPS").pt"
          test -s "$checkpoint"
          python scripts/evaluate_text.py \
            --checkpoint "$checkpoint" \
            --validation-text incoming/partitions/test.txt \
            --profile tiny --batches 256 --batch-size 2 --seed 2026 --device cpu \
            --output reports/holdout-after.json
          python scripts/evaluate_domains.py \
            --checkpoint "$checkpoint" \
            --dataset benchmarks/domains_v1.jsonl --profile tiny --device cpu \
            --output reports/domains-after.json

      - name: Consolidar comparación y demostrar identidad del holdout
        if: always()
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          p = Path("reports")
          result = {
              "experiment": "roninlm-legacy-2000-holdout-before-after-v1",
              "steps": int(os.environ["STEPS"]),
              "training": {
                  "dataset": "ronin-spanish-public-domain-literature-v2",
                  "documents": 608,
                  "bytes": 140295523,
                  "sha256": "9cd5d7e83ed7690713add22c40fdf35eaf1fb88da3dafb748ca8201b08df9a78",
                  "holdout_used_for_training": False
              },
              "holdout": {
                  "partition": "test",
                  "documents": 18,
                  "bytes": 6681947,
                  "expected_sha256": "6ea09e2c0e4a2cc2753dfc91c841335600a9c6a954f3cf0ffb8b1d2336bfbd94",
                  "same_file_before_after": True,
                  "used_for_gradients": False
              },
              "metrics": {},
              "limitations": [
                  "El holdout literario oficial consta de 18 documentos; no equivale a un benchmark amplio de razonamiento.",
                  "La evaluación byte-level mide modelado de texto, no comprensión factual ni razonamiento general.",
                  "El benchmark multidominio de 23 preguntas se informa por separado y no se etiqueta como holdout."
              ]
          }
          for name in ("holdout-before.json", "holdout-after.json", "domains-before.json",
                       "domains-after.json", "training-throughput.json"):
              f = p / name
              if f.is_file():
                  result["metrics"][name] = json.loads(f.read_text(encoding="utf-8"))
          before = result["metrics"].get("holdout-before.json")
          after = result["metrics"].get("holdout-after.json")
          if before and after:
              result["holdout"]["before_checkpoint_sha256"] = before.get("checkpoint_sha256")
              result["holdout"]["after_checkpoint_sha256"] = after.get("checkpoint_sha256")
              result["holdout"]["before_bits_per_byte"] = before.get("bits_per_byte")
              result["holdout"]["after_bits_per_byte"] = after.get("bits_per_byte")
              result["holdout"]["delta_bits_per_byte"] = after["bits_per_byte"] - before["bits_per_byte"]
              result["holdout"]["improved"] = after["bits_per_byte"] < before["bits_per_byte"]
              result["holdout"]["before_evaluated_tokens"] = before.get("evaluated_tokens")
              result["holdout"]["after_evaluated_tokens"] = after.get("evaluated_tokens")
              if before.get("bits_per_byte") is None or after.get("bits_per_byte") is None:
                  raise SystemExit("El evaluador no devolvió bits_per_byte; no se puede afirmar comparación.")
          (p / "holdout-comparison.json").write_text(json.dumps(result, ensure_ascii=False, indent=2)+"\n", encoding="utf-8")
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Publicar métricas, manifiesto y checkpoint
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ronin-legacy-2000-holdout-comparison
          path: |
            reports/
            checkpoints/initial.pt
            checkpoints/trained/
          if-no-files-found: warn
          retention-days: 30

      - name: Enlazar libro de runs
        if: always()
        uses: ./.github/actions/run-ledger-link
