name: Preflight PMC OA — metadatos CC0 y CC-BY

on:
  push:
    branches: [main]
    paths:
      - scripts/preflight_pmc_oa.py
      - .github/workflows/preflight-pmc-oa.yml
  schedule:
    - cron: "41 3 1 * *"
  workflow_dispatch:
    inputs:
      sample_limit:
        description: Registros de metadatos por dominio (1-1000)
        required: true
        default: "500"
        type: string

permissions:
  contents: read

concurrency:
  group: ronin-pmc-oa-preflight
  cancel-in-progress: false

jobs:
  metadata-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Ejecutar inventario metadata-only
        env:
          SAMPLE_LIMIT: ${{ inputs.sample_limit || '500' }}
        run: |
          python scripts/preflight_pmc_oa.py \
            --sample-limit "$SAMPLE_LIMIT" \
            --output reports/pmc-oa-preflight
      - name: Validar que no se ha descargado texto de artículos
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("reports/pmc-oa-preflight")
          index = json.loads((root / "INDEX.json").read_text(encoding="utf-8"))
          assert index["training_eligible"] is False
          assert index["candidate_text_downloads_authorized"] is False
          for path in root.glob("*.json"):
              if path.name == "INDEX.json":
                  continue
              report = json.loads(path.read_text(encoding="utf-8"))
              assert report["retrieval_mode"].endswith("no full-text requests")
              assert report["training_eligible"] is False
              assert report["s3_metadata_verification_errors"] == 0
              assert report["s3_metadata_verified_versions"] > 0
              assert all("abstract" not in row and "full_text" not in row for row in report["sample"])
          print(json.dumps(index, ensure_ascii=False, indent=2))
          PY
      - name: Publicar inventario de metadatos
        uses: actions/upload-artifact@v6
        with:
          name: ronin-pmc-oa-metadata-preflight
          path: reports/pmc-oa-preflight/
          if-no-files-found: error
          retention-days: 90
      - name: Enlazar libro de runs
        if: always()
        uses: ./.github/actions/run-ledger-link
