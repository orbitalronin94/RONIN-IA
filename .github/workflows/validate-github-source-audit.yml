name: Validate GitHub dataset source audit

on:
  push:
    branches: [main]
    paths:
      - "data/datasets/candidates/github-source-audit.json"
      - "scripts/validate_github_source_audit.py"
      - ".github/workflows/validate-github-source-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validate audit register and safety invariants
        run: python scripts/validate_github_source_audit.py
