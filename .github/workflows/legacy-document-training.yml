name: Entrenamiento documental legacy — RoninLM

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/legacy-document-training.yml"
      - "scripts/prepare_legacy_training_split.py"
  workflow_dispatch:
    inputs:
      steps:
        description: Pasos de entrenamiento (1-1000)
        required: true
        default: "500"
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: ronin-legacy-document-training
  cancel-in-progress: false

jobs:
  train:
    name: RoninLM tiny sobre 608 documentos legacy auditados
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      SOURCE_RUN_ID: "41926088900"
      STEPS: ${{ inputs.steps || '500' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validar presupuesto
        run: |
          if ! [[ "$STEPS" =~ ^[0-9]+$ ]] || [ "$STEPS" -lt 1 ] || [ "$STEPS" -gt 1000 ]; then
            echo "::error::STEPS debe estar entre 1 y 1000."
            exit 1
          fi

      - name: Descargar corpus train legacy fijado
        uses: actions/download-artifact@v6
        with:
          name: ronin-admitted-literature-es-v1-train
          path: incoming/legacy
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Verificar manifiesto, estado y SHA-256 del corpus
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("incoming/legacy")
          train = root / "train.txt"
          manifest_path = root / "dataset-manifest.json"
          if not train.is_file() or not manifest_path.is_file():
              raise SystemExit("Faltan train.txt o dataset-manifest.json.")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          digest = hashlib.sha256(train.read_bytes()).hexdigest()
          expected = "9cd5d7e83ed7690713add22c40fdf35eaf1fb88da3dafb748ca8201b08df9a78"
          checks = {
              "dataset_id": manifest.get("dataset_id") == "ronin-spanish-public-domain-literature-v2",
              "status": manifest.get("status") == "admitted_scoped_training_partition",
              "training_eligible": manifest.get("training_eligible") is True,
              "global_g0_remains_false": manifest.get("global_g0_pass") is False,
              "documents": manifest.get("document_count") == 608,
              "bytes": manifest.get("train_bytes") == 140295523,
              "manifest_sha": manifest.get("train_sha256") == expected,
              "payload_sha": digest == expected,
              "holdouts_excluded": manifest.get("validation_test_included") is False,
          }
          print(json.dumps({"checks": checks, "manifest": manifest}, ensure_ascii=False, indent=2))
          if not all(checks.values()):
              raise SystemExit("Legacy scoped admission verification failed.")
          PY

      - name: Instalar PyTorch CPU y dependencias RONIN
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          python -m pip install -e . --no-deps
          python -m pip install "numpy>=1.26" "PyYAML>=6.0" "tqdm>=4.66"

      - name: Crear validación interna sin tocar los holdouts legacy
        run: |
          python scripts/prepare_legacy_training_split.py \
            --input incoming/legacy/train.txt \
            --output-dir /tmp/ronin-legacy-split \
            --validation-fraction 0.05 \
            --seed 42005

      - name: Crear checkpoint inicial reproducible
        run: |
          mkdir -p reports checkpoints
          python - <<'PY'
          import torch
          from ronin.config import get_profile
          from ronin.models.transformer import RoninLM
          from ronin.utils.repro import seed_everything

          config, _ = get_profile("tiny")
          seed_everything(1337)
          model = RoninLM(config)
          torch.save({"model": model.state_dict(), "step": 0}, "checkpoints/initial.pt")
          print(f"Parámetros: {model.parameter_count}")
          PY

      - name: Medir modelo inicial en validación interna
        run: |
          python scripts/evaluate_text.py \
            --checkpoint checkpoints/initial.pt \
            --validation-text /tmp/ronin-legacy-split/validation-internal.txt \
            --profile tiny --batches 128 --batch-size 2 --seed 2026 --device cpu \
            --output reports/language-model-initial.json
          python scripts/evaluate_domains.py \
            --checkpoint checkpoints/initial.pt \
            --dataset benchmarks/domains_v1.jsonl --profile tiny --device cpu \
            --output reports/domains-initial.json

      - name: Entrenar RoninLM desde cero con documentos legacy
        run: |
          start=$(date +%s)
          python scripts/train_text.py \
            --text /tmp/ronin-legacy-split/train-internal.txt \
            --profile tiny --steps "$STEPS" --seed 1337 \
            --device cpu --num-threads 2 \
            --checkpoints checkpoints/trained \
            --metrics-out reports/training-throughput.json
          end=$(date +%s)
          echo "$((end - start))" > reports/training-seconds.txt

      - name: Evaluar modelo entrenado
        run: |
          checkpoint="checkpoints/trained/step-$(printf '%08d' "$STEPS").pt"
          test -s "$checkpoint"
          python scripts/evaluate_text.py \
            --checkpoint "$checkpoint" \
            --validation-text /tmp/ronin-legacy-split/validation-internal.txt \
            --profile tiny --batches 128 --batch-size 2 --seed 2026 --device cpu \
            --output reports/language-model-trained.json
          python scripts/evaluate_domains.py \
            --checkpoint "$checkpoint" \
            --dataset benchmarks/domains_v1.jsonl --profile tiny --device cpu \
            --output reports/domains-trained.json

      - name: Consolidar resultados y hashes
        if: always()
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          reports = Path("reports")
          result = {
              "experiment": "roninlm-legacy-literature-document-training-v1",
              "dataset": "ronin-spanish-public-domain-literature-v2",
              "source_run_id": int(os.environ["SOURCE_RUN_ID"]),
              "source_documents": 608,
              "source_train_bytes": 140295523,
              "source_train_sha256": "9cd5d7e83ed7690713add22c40fdf35eaf1fb88da3dafb748ca8201b08df9a78",
              "data_scope": "legacy scoped admission only; no automatic promotion into the 64 Level-A libraries",
              "legacy_validation_and_test_read": False,
              "training_steps_requested": int(os.environ["STEPS"]),
              "device": "GitHub Actions CPU",
              "metrics": {},
              "limitations": [
                  "The internal validation split is derived only from the admitted legacy train partition.",
                  "The original 18-document legacy validation and 18-document test partitions were not downloaded or read.",
                  "This experiment does not establish global G-0 and does not clear any of the 64 new libraries.",
                  "A lower byte-level loss is not evidence of general reasoning or factual competence."
              ]
          }
          for name in ("language-model-initial.json", "language-model-trained.json",
                       "domains-initial.json", "domains-trained.json",
                       "training-throughput.json", "training-seconds.txt"):
              path = reports / name
              if path.is_file():
                  if path.suffix == ".json":
                      result["metrics"][name] = json.loads(path.read_text(encoding="utf-8"))
                  else:
                      result["metrics"][name] = int(path.read_text().strip())
          before = result["metrics"].get("language-model-initial.json", {})
          after = result["metrics"].get("language-model-trained.json", {})
          if before and after:
              result["delta_bits_per_byte"] = after["bits_per_byte"] - before["bits_per_byte"]
              result["validation_bpb_improved"] = after["bits_per_byte"] < before["bits_per_byte"]
          (reports / "summary.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Publicar métricas y checkpoint
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ronin-legacy-document-training
          path: |
            reports/
            checkpoints/initial.pt
            checkpoints/trained/
            /tmp/ronin-legacy-split/split-manifest.json
          if-no-files-found: warn
          retention-days: 30

      - name: Enlazar libro de runs
        if: always()
        uses: ./.github/actions/run-ledger-link
