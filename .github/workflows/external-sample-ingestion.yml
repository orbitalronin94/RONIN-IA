name: Ingesta de muestras CC0/CC-BY — Wikidata + Europe PMC

on:
  push:
    branches: [main]
    paths:
      - "scripts/ingest_external_samples.py"
      - ".github/workflows/external-sample-ingestion.yml"
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:
    inputs:
      limit_per_source:
        description: Máximo de registros por fuente (1-1000)
        required: true
        default: "500"
        type: string

permissions:
  contents: write

concurrency:
  group: external-sample-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch rights-filtered samples
        env:
          SAMPLE_LIMIT: ${{ inputs.limit_per_source || '500' }}
        run: python scripts/ingest_external_samples.py --limit-per-source "$SAMPLE_LIMIT"
      - name: Validate generated manifests and hashes
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          for folder in ("wikidata_cc0", "europe_pmc_cc_by_cc0"):
              root = Path("data/external_samples") / folder
              manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
              sample = root / "sample.jsonl"
              assert manifest["training_eligible"] is False
              assert hashlib.sha256(sample.read_bytes()).hexdigest() == manifest["sha256"]
              assert manifest["records"] > 0
              print(folder, manifest["records"], manifest["sha256"])
          PY
      - name: Commit versioned samples and manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/external_samples/
          if git diff --cached --quiet; then
            echo "No sample changes to commit."
          else
            git commit -m "data: update rights-filtered external samples"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Publish sample artifact
        uses: actions/upload-artifact@v4
        with:
          name: ronin-external-dataset-samples
          path: data/external_samples/
          if-no-files-found: error
          retention-days: 90
      - name: Link run ledger
        if: always()
        uses: ./.github/actions/run-ledger-link
