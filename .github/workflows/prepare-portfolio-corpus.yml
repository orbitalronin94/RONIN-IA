name: Construir índice RAG experto de Portfolio

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  preparar:
    name: Preparar documentos de recuperación autorizados
    runs-on: ubuntu-latest
    steps:
      - name: Obtener RONIN IA
        uses: actions/checkout@v5

      - name: Obtener Portfolio en revisión inmutable
        uses: actions/checkout@v5
        with:
          repository: orbitalronin94/Portfolio
          ref: fffc234fdf3f82b6a90d56ae9b190d1c0de79690
          path: data/source/portfolio

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar extractor PDF
        run: python -m pip install --upgrade pypdf

      - name: Crear documentos de recuperación y manifiesto
        run: |
          python scripts/prepare_portfolio_corpus.py \
            --source-dir data/source/portfolio/Papers \
            --output-dir /tmp/ronin-portfolio-rag/source \
            --source-revision fffc234fdf3f82b6a90d56ae9b190d1c0de79690

      - name: Construir índice de recuperación FTS5 con citas
        run: python scripts/build_portfolio_rag_index.py --source-dir /tmp/ronin-portfolio-rag/source --output-dir /tmp/ronin-portfolio-rag/index

      - name: Publicar índice RAG como artefacto temporal
        uses: actions/upload-artifact@v6
        with:
          name: ronin-portfolio-rag-index
          path: /tmp/ronin-portfolio-corpus/
          if-no-files-found: error
          retention-days: 7
      - name: Enlazar libro de runs
        if: always()
        uses: ./.github/actions/run-ledger-link
