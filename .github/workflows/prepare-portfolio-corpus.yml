name: Preparar corpus propio de Portfolio

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  preparar:
    name: Preparar y auditar documentos autorizados
    runs-on: ubuntu-latest
    steps:
      - name: Obtener RONIN IA
        uses: actions/checkout@v4

      - name: Obtener Portfolio en revisión inmutable
        uses: actions/checkout@v4
        with:
          repository: orbitalronin94/Portfolio
          ref: fffc234fdf3f82b6a90d56ae9b190d1c0de79690
          path: data/source/portfolio

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar extractor PDF
        run: python -m pip install --upgrade pypdf

      - name: Crear corpus y manifiesto
        run: |
          python scripts/prepare_portfolio_corpus.py \
            --source-dir data/source/portfolio/Papers \
            --output-dir /tmp/ronin-portfolio-corpus \
            --source-revision fffc234fdf3f82b6a90d56ae9b190d1c0de79690

      - name: Publicar corpus de preparación como artefacto temporal
        uses: actions/upload-artifact@v4
        with:
          name: ronin-portfolio-corpus-staging
          path: /tmp/ronin-portfolio-corpus/
          if-no-files-found: error
          retention-days: 7
      - name: Enlazar libro de runs
        if: always()
        uses: ./.github/actions/run-ledger-link
