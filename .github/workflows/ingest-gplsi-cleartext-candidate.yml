name: Ingest GPLSI ClearText CAS and VAL candidates

on:
  push:
    branches: [main]
    paths:
      - "scripts/ingest_gplsi_cleartext_candidate.py"
      - ".github/workflows/ingest-gplsi-cleartext-candidate.yml"
  workflow_dispatch:
  schedule:
    - cron: "7 8 23 * *"

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Fetch pinned GPLSI ClearText files and quarantine restrictive notices
        run: python scripts/ingest_gplsi_cleartext_candidate.py
      - uses: actions/upload-artifact@v6
        with:
          name: ronin-gplsi-cleartext-cas-val-candidates
          path: artifacts/gplsi-cleartext/
          if-no-files-found: error
          retention-days: 90
