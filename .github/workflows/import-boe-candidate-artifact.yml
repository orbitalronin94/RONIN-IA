name: Import validated BOE candidate artifact into repository

on:
  pull_request:
    branches: [main]
    types: [opened]
    paths:
      - ".github/workflows/import-boe-candidate-artifact.yml"

permissions:
  actions: read
  contents: write

concurrency:
  group: import-boe-candidate-artifact-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  import:
    if: github.event_name == 'pull_request' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Download the successful BOE acquisition artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: "42693866538"
        run: |
          mkdir -p data/datasets/candidates/boe-consolidated-2026-11-09
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name boe-active-consolidated-spanish-candidates --dir data/datasets/candidates/boe-consolidated-2026-11-09
      - name: Verify every payload and evidence snapshot
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("data/datasets/candidates/boe-consolidated-2026-11-09")
          rows=[json.loads(x) for x in (root/"manifest.jsonl").read_text(encoding="utf-8").splitlines()]
          assert len(rows)==175, f"expected 175 candidate laws, got {len(rows)}"
          for r in rows:
            assert r["rights_level"]=="B" and r["training_eligible"] is False
            assert hashlib.sha256(r["text"].encode("utf-8")).hexdigest()==r["payload_sha256"]
            assert hashlib.sha256((root/r["metadata_snapshot_path"]).read_bytes()).hexdigest()==r["metadata_snapshot_sha256"]
            assert hashlib.sha256((root/r["xml_snapshot_path"]).read_bytes()).hexdigest()==r["text_snapshot_sha256"]
          audit=json.loads((root/"acquisition-audit.json").read_text(encoding="utf-8"))
          assert audit["candidate_words"]==2704508
          assert audit["rights_level_A"]==0 and audit["training_eligible"]==0
          (root/"README.md").write_text(
            "# BOE — legislación consolidada en español (candidatos Nivel B)\n\n"
            "Adquisición oficial del 9 de noviembre de 2026: 175 normas estatales vigentes y finalizadas, "
            "2.704.508 palabras y 17.823.069 bytes de texto UTF-8. Se conservan manifiesto, XML exacto, "
            "metadatos por norma y hashes SHA-256.\n\n"
            "Fuente: API de legislación consolidada de la AEBOE. Las condiciones de reutilización "
            "permiten adaptación y reutilización mundial con atribución, pero excluyen elementos de "
            "terceros. Por prudencia, todos los registros permanecen en Nivel B y "
            "training_eligible=false hasta revisión por elemento de derechos de terceros, privacidad, "
            "calidad, deduplicación y particionado. El texto consolidado es meramente informativo y "
            "no tiene valor jurídico.\n",
            encoding="utf-8",
          )
          print(json.dumps({
            "documents":len(rows),
            "words":audit["candidate_words"],
            "text_bytes":audit["candidate_text_bytes"],
            "rights_level_B":audit["rights_level_B"],
            "training_eligible":0
          },ensure_ascii=False,indent=2))
          PY
      - name: Commit candidate corpus to this PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/datasets/candidates/boe-consolidated-2026-11-09
          if git diff --cached --quiet; then
            echo "Candidate artifact already present; nothing to commit."
          else
            git commit -m "data(boe): preserve 175 Spanish legislation candidates"
            git push origin "HEAD:$GITHUB_HEAD_REF"
          fi
