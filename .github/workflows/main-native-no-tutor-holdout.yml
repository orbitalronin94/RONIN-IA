name: RONIN — entrenamiento propio sin tutor + holdout antes/después
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/main-native-no-tutor-holdout.yml"
  workflow_dispatch:
    inputs:
      steps:
        description: Pasos de entrenamiento desde el checkpoint propio
        required: true
        default: "500"
        type: string
      eval_limit:
        description: Preguntas MMLU-Pro para el ciclo rápido (0 = test completo, solo auditoría final)
        required: true
        default: "512"
        type: choice
        options: ["256", "512", "1024", "0"]
permissions:
  actions: read
  contents: read
concurrency:
  group: ronin-main-native-no-tutor-holdout
  cancel-in-progress: false
jobs:
  native-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      LITERATURE_RUN_ID: "41926088900"
      MATHLIB_RUN_ID: "42026633643"
      NASA_FILE_REVIEWED_RUN_ID: "42028138060"
      MMLU_REVISION: "b189ec765aa7ed75c8acfea42df31fdae71f97be"
      STEPS: ${{ inputs.steps || '500' }}
      EVAL_LIMIT: ${{ inputs.eval_limit || '512' }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github
            LICENSE
            pyproject.toml
            weights
            benchmarks
            configs
            ronin
            scripts
      - name: Validate budget
        run: |
          [[ "$STEPS" =~ ^[0-9]+$ ]] && [ "$STEPS" -ge 100 ] && [ "$STEPS" -le 1000 ]
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          python -m pip install -e . --no-deps
          python -m pip install "numpy>=1.26" "PyYAML>=6.0" "tqdm>=4.66" "datasets==3.6.0" "dill==0.3.8" "multiprocess==0.70.16" "huggingface_hub==0.36.0"
          python -m compileall -q scripts/prepare_legacy_training_split.py scripts/train_text.py scripts/evaluate_mmlu_pro.py
      - name: Download admitted literature train partition
        uses: actions/download-artifact@v6
        with:
          name: ronin-admitted-literature-es-v1-train
          path: incoming/literature
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.LITERATURE_RUN_ID }}
      - name: Download admitted Mathlib4 train partition
        uses: actions/download-artifact@v6
        with:
          name: ronin-admitted-mathlib4-v1
          path: incoming/mathlib4
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.MATHLIB_RUN_ID }}
      - name: Download individually reviewed NASA train partition
        uses: actions/download-artifact@v6
        with:
          name: ronin-nasa-ntrs-file-reviewed-train
          path: incoming/nasa-file-reviewed
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.NASA_FILE_REVIEWED_RUN_ID }}
      - name: Verify checkpoint and every admitted training partition
        run: |
          python - <<'PY'
          import hashlib, json, shutil
          from pathlib import Path
          import torch
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          base=Path("weights/ronin-main.pt")
          model_manifest=json.loads(Path("weights/main-model.json").read_text(encoding="utf-8"))
          lit=Path("incoming/literature/train.txt")
          lm=Path("incoming/literature/dataset-manifest.json")
          math=Path("incoming/mathlib4/train.txt")
          mmf=Path("incoming/mathlib4/manifest.json")
          nasa=Path("incoming/nasa-file-reviewed/train.txt")
          nmf=Path("incoming/nasa-file-reviewed/manifest.json")
          ndocs=Path("incoming/nasa-file-reviewed/documents.train.jsonl")
          assert all(p.is_file() for p in (base,lit,lm,math,mmf,nasa,nmf,ndocs))
          assert sha(base)==model_manifest["weights_sha256"]
          assert model_manifest["checkpoint_sha256"]=="a90a01a3e7f53e2e4aec1f0c1f0c137eedfe219f3fc3cc65f5eea827829d6f25"
          assert sha(lit)=="9cd5d7e83ed7690713add22c40fdf35eaf1fb88da3dafb748ca8201b08df9a78"
          l=json.loads(lm.read_text())
          assert l.get("dataset_id")=="ronin-spanish-public-domain-literature-v2"
          assert l.get("status")=="admitted_scoped_training_partition" and l.get("training_eligible") is True
          assert l.get("document_count")==608
          assert l.get("train_bytes")==140295523 and l.get("validation_test_included") is False
          m=json.loads(mmf.read_text())
          assert m.get("dataset_id")=="mathlib4-lean-proof-corpus-v1"
          assert m.get("status")=="admitted_scoped_training_partition"
          part=m["aggregate"]["partitions"]["train"]
          assert part["training_eligible"] is True and part["documents"]==8498
          expected="7c82a4d1e0f3788d6038002b41ae1ead1bf6a16cbf4e332f59f015501325667c"
          assert part["text_sha256"]==expected and sha(math)==expected
          n=json.loads(nmf.read_text())
          npart=n["partitions"]["train"]
          assert n.get("dataset_id")=="nasa-ntrs-file-reviewed-v1"
          assert n.get("status")=="admitted_scoped_training_partition" and n.get("training_eligible") is True
          assert npart.get("training_eligible") is True and npart.get("documents")==2
          assert sha(nasa)==npart["sha256"]=="874c77ef785236ce726a89a217b450684f36b82402b35174d9bbf3328249d1f8"
          nasa_rows=[json.loads(line) for line in ndocs.read_text(encoding="utf-8").splitlines() if line.strip()]
          assert len(nasa_rows)==2 and all(row.get("partition")=="train" for row in nasa_rows)
          assert {row.get("document_id") for row in nasa_rows}=={"19620002819","19630000935"}
          assert all(row.get("content_review")=="PASS_WITH_OCR_NOISE" and row.get("rights")=="NASA NTRS record-level Public Use Permitted" for row in nasa_rows)
          assert {row.get("text_sha256") for row in nasa_rows}=={"039f1edab34becc04e9a367814acc3a5ec08ba510d7913813468ca2d9598aebe","d3177bef2b74f196f125e55bb928f751e41d1e16e7063805c502aa96d380cc24"}
          ck=torch.load(base,map_location="cpu",weights_only=False)
          assert isinstance(ck,dict)
          state_dict=ck.get("model",ck)
          assert isinstance(state_dict,dict) and state_dict
          assert all(isinstance(t,torch.Tensor) for t in state_dict.values())
          from ronin.config import get_profile
          from ronin.models.transformer import RoninLM
          model_config,_=get_profile("tiny")
          model=RoninLM(model_config)
          model.load_state_dict(state_dict,strict=True)
          parameter_count=sum(t.numel() for t in state_dict.values())
          assert ck.get("step",model_manifest["checkpoint_step"])==model_manifest["checkpoint_step"]==1000
          assert parameter_count==model_manifest["parameters"]==9922880
          print("Modelo verificado:", model_manifest["model_name"], "| parámetros=", parameter_count, "| pesos_sha256=", model_manifest["weights_sha256"])
          Path("checkpoints").mkdir(exist_ok=True)
          shutil.copy2(base,"checkpoints/main.pt")
          print("Integrity checks OK: 608 literature + 8498 Mathlib4 + 2 NASA file-reviewed = 9108 scoped train docs; 237957184 source bytes. No tutor data. Validation/test partitions excluded.")
          PY
      - name: Assemble all and only train-eligible admitted documents
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          lit=Path("incoming/literature/train.txt").read_bytes()
          math=Path("incoming/mathlib4/train.txt").read_bytes()
          nasa=Path("incoming/nasa-file-reviewed/train.txt").read_bytes()
          out=Path("/tmp/ronin-native-train.txt")
          out.write_bytes(lit+b"\n\n"+math+b"\n\n"+nasa)
          report={
            "experiment":"ronin-native-no-tutor-v1",
            "tutor_used":False,
            "sources":[
              {"dataset_id":"ronin-spanish-public-domain-literature-v2","documents":608,"bytes":140295523,"sha256":"9cd5d7e83ed7690713add22c40fdf35eaf1fb88da3dafb748ca8201b08df9a78"},
              {"dataset_id":"mathlib4-lean-proof-corpus-v1","documents":8498,"bytes":97629252,"sha256":"7c82a4d1e0f3788d6038002b41ae1ead1bf6a16cbf4e332f59f015501325667c"},
              {"dataset_id":"nasa-ntrs-file-reviewed-v1","documents":2,"bytes":32409,"sha256":"874c77ef785236ce726a89a217b450684f36b82402b35174d9bbf3328249d1f8"}
            ],
            "train_documents":9108,
            "source_train_bytes":237957184,
            "combined_bytes":out.stat().st_size,
            "combined_sha256":hashlib.sha256(out.read_bytes()).hexdigest(),
            "validation_test_partitions_in_training":False,
            "excluded_not_training_eligible":["NASA NTRS public-use unreviewed remainder (811 scoped records; only 2 individually promoted)","ScienceVerse (7365 scoped)","owner Papers (9 Markdown)"],
          }
          Path("reports").mkdir(exist_ok=True)
          Path("reports/native-mixture.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Create internal validation split from train only
        run: |
          python scripts/prepare_legacy_training_split.py --input /tmp/ronin-native-train.txt --output-dir /tmp/ronin-native-split --validation-fraction 0.05 --seed 42006
      - name: Evaluate native main BEFORE on fixed holdouts
        run: |
          python scripts/evaluate_text.py --checkpoint checkpoints/main.pt --validation-text /tmp/ronin-native-split/validation-internal.txt --profile tiny --batches 128 --batch-size 2 --seed 2026 --device cpu --output reports/language-before.json
          python scripts/evaluate_domains.py --checkpoint checkpoints/main.pt --dataset benchmarks/domains_v1.jsonl --profile tiny --device cpu --output reports/domains-before.json
          python scripts/evaluate_mmlu_pro.py --checkpoint checkpoints/main.pt --profile tiny --context-length 4096 --limit "$EVAL_LIMIT" --seed 2026 --revision "$MMLU_REVISION" --split test --device cpu --batch-token-budget 8192 --output reports/mmlu-holdout-before.json
      - name: Train RONIN from its own checkpoint — NO TUTOR
        run: |
          python scripts/train_text.py --text /tmp/ronin-native-train.txt --profile tiny --steps "$STEPS" --seed 20261106 --init-checkpoint checkpoints/main.pt --learning-rate 0.00001 --min-learning-rate 0.000001 --device cpu --num-threads 2 --checkpoints checkpoints/native-candidate --metrics-out reports/training-throughput.json
          candidate="checkpoints/native-candidate/step-$(printf '%08d' "$STEPS").pt"
          test -s "$candidate"
          cp "$candidate" checkpoints/candidate.pt
      - name: Evaluate native candidate AFTER on identical fixed holdouts
        run: |
          python scripts/evaluate_text.py --checkpoint checkpoints/candidate.pt --validation-text /tmp/ronin-native-split/validation-internal.txt --profile tiny --batches 128 --batch-size 2 --seed 2026 --device cpu --output reports/language-after.json
          python scripts/evaluate_domains.py --checkpoint checkpoints/candidate.pt --dataset benchmarks/domains_v1.jsonl --profile tiny --device cpu --output reports/domains-after.json
          python scripts/evaluate_mmlu_pro.py --checkpoint checkpoints/candidate.pt --profile tiny --context-length 4096 --limit "$EVAL_LIMIT" --seed 2026 --revision "$MMLU_REVISION" --split test --device cpu --batch-token-budget 8192 --output reports/mmlu-holdout-after.json
      - name: Compare paired full holdout and publish decision — never auto-promote
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("reports")
          p.mkdir(parents=True,exist_ok=True)
          def load(n):
            f=p/n
            return json.loads(f.read_text()) if f.is_file() else None
          b,a=load("mmlu-holdout-before.json"),load("mmlu-holdout-after.json")
          l0,l1=load("language-before.json"),load("language-after.json")
          result={"experiment":"ronin-native-no-tutor-v1","tutor_used":False,"automatic_promotion":False,"decision":"INCOMPLETE","metrics":{}}
          for n in ("native-mixture.json","domains-before.json","domains-after.json","training-throughput.json"):
            v=load(n)
            if v is not None: result["metrics"][n]=v
          if b and a:
            ids0=[x.get("id") for x in b.get("details",[])]
            ids1=[x.get("id") for x in a.get("details",[])]
            same=(b.get("dataset_revision")==a.get("dataset_revision")==__import__("os").environ["MMLU_REVISION"] and b.get("dataset_split")==a.get("dataset_split")=="test" and b.get("dataset_sha256")==a.get("dataset_sha256") and b.get("selected_items")==a.get("selected_items") and b.get("evaluated_items")==a.get("evaluated_items") and ids0==ids1 and b.get("coverage",0)>=0.95 and a.get("coverage",0)>=0.95)
            delta=(a["overall"]["accuracy"]-b["overall"]["accuracy"])*100
            result["mmlu_pro_full_holdout"]={"revision":a["dataset_revision"],"dataset_sha256":a["dataset_sha256"],"selected_items":a["selected_items"],"evaluated_before":b["evaluated_items"],"evaluated_after":a["evaluated_items"],"coverage_before":b["coverage"],"coverage_after":a["coverage"],"before_correct":b["overall"]["correct"],"after_correct":a["overall"]["correct"],"before_accuracy":b["overall"]["accuracy"],"after_accuracy":a["overall"]["accuracy"],"delta_percentage_points":delta,"same_full_holdout_before_after":same,"complete_test_set_before":b.get("complete_test_set"),"complete_test_set_after":a.get("complete_test_set"),"evaluation_tier":"full_test_audit" if b.get("complete_test_set") and a.get("complete_test_set") else "fixed_stratified_iteration_holdout"}
            if l0 and l1:
              nonreg=l1["bits_per_byte"]<=l0["bits_per_byte"]
              result["language_validation_non_regression"]=nonreg
              result["decision"]="CANDIDATE_READY_FOR_REVIEW" if same and delta>0 and nonreg else "DO_NOT_PROMOTE"
          for n in ("language-before.json","language-after.json"):
            v=load(n)
            if v is not None: result["metrics"][n]=v
          (p/"native-no-tutor-summary.json").write_text(json.dumps(result,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - name: Upload paired benchmark, corpus manifest and candidate
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ronin-native-no-tutor-${{ github.run_id }}
          path: |
            reports/
            checkpoints/main.pt
            checkpoints/candidate.pt
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6
