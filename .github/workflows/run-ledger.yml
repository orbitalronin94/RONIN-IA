name: Libro de runs — registro automático

on:
  workflow_run:
    workflows:
      - "Integración continua"
      - "Experimento oficial RONIN desde cero + MMLU-Pro completo"
      - "Experimento RONIN desde cero + MMLU-Pro reducido"
      - "Auditoría comparativa Supra → RONIN"
      - "Validar manifiesto de datasets externos"
      - "Ingesta de muestras CC0/CC-BY — Wikidata + Europe PMC"
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: ronin-run-ledger
  cancel-in-progress: false

jobs:
  append-run:
    if: github.event.workflow_run.name != 'Libro de runs — registro automático'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Append completed run
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/append_run_ledger.py
      - name: Commit ledger update
        run: |
          if git diff --quiet -- docs/RUNS.md; then
            echo "No ledger changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/RUNS.md
          git commit -m "docs: record completed GitHub Actions run"
          git push origin HEAD:main
      - name: Link ledger in this registrar run
        if: always()
        run: |
          echo "## Libro de runs" >> "$GITHUB_STEP_SUMMARY"
          echo "Consulta el [historial de ejecuciones](https://github.com/$GITHUB_REPOSITORY/blob/main/docs/RUNS.md)." >> "$GITHUB_STEP_SUMMARY"
