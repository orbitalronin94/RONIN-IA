name: arXiv rights and peer-review preflight

on:
  workflow_dispatch:
    inputs:
      max_records:
        description: "0 = complete OAI metadata catalogue; use 1000 for smoke test"
        required: false
        default: "0"
  schedule:
    - cron: "41 3 * * 1"

permissions:
  contents: read

concurrency:
  group: arxiv-rights-preflight
  cancel-in-progress: false

jobs:
  metadata-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Harvest arXiv OAI metadata (no full-text download)
        env:
          MAX_RECORDS: ${{ inputs.max_records || '0' }}
        run: |
          python scripts/arxiv_oai_license_preflight.py \
            --max-records "$MAX_RECORDS" \
            --sleep-seconds 1.0 \
            --output reports/arxiv-oai-license-preflight/summary.json \\
            --records-output reports/arxiv-oai-license-preflight/records.jsonl.gz
      - name: Upload immutable metadata report
        uses: actions/upload-artifact@v4
        with:
          name: ronin-arxiv-oai-license-preflight
          path: reports/arxiv-oai-license-preflight/
          if-no-files-found: error
          retention-days: 90
