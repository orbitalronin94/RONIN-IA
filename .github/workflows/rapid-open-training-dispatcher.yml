name: Encadenador automático de ciclos RONIN

on:
  workflow_run:
    workflows: ["Ciclos rápidos RONIN — corpus abierto con gate y mejora de validación"]
    types: [completed]
    branches: [main]

permissions:
  actions: write
  contents: read

concurrency:
  group: ronin-rapid-training-dispatcher
  cancel-in-progress: false

jobs:
  dispatch-next:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Lanzar automáticamente la siguiente tanda
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --method POST "repos/$GH_REPO/actions/workflows/rapid-open-training-cycles.yml/dispatches" -f ref=main
          echo "Siguiente tanda de entrenamiento solicitada automáticamente."
