name: Expand scientific datasets — PMC OA CC0/CC-BY candidates

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prepare-pmc-oa-candidates.yml"
      - "scripts/prepare_pmc_oa_candidates.py"
      - "scripts/pmc_oa_source.py"
      - "scripts/preflight_pmc_oa.py"
      - "data/manifests/knowledge_dense_sources.json"
      - "reports/license_audit.json"
  schedule:
    - cron: "29 3 * * 0"
  workflow_dispatch:
    inputs:
      max_documents:
        description: Maximum article versions inspected per domain
        required: true
        default: "10000"
        type: string
      max_text_mib:
        description: Maximum accepted text inspected per domain (MiB)
        required: true
        default: "512"
        type: string

permissions:
  contents: read

concurrency:
  group: ronin-pmc-oa-candidate-expansion
  cancel-in-progress: false

jobs:
  prepare:
    name: PMC OA candidates — ${{ matrix.domain }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        domain: [biology_medicine, chemistry]
    env:
      DOMAIN: ${{ matrix.domain }}
      MAX_DOCUMENTS: ${{ inputs.max_documents || '10000' }}
      MAX_TEXT_MIB: ${{ inputs.max_text_mib || '512' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validate safe bounded parameters
        run: |
          [[ "$MAX_DOCUMENTS" =~ ^[0-9]+$ ]] && [ "$MAX_DOCUMENTS" -ge 2 ] && [ "$MAX_DOCUMENTS" -le 10000 ]
          [[ "$MAX_TEXT_MIB" =~ ^[0-9]+$ ]] && [ "$MAX_TEXT_MIB" -ge 16 ] && [ "$MAX_TEXT_MIB" -le 512 ]
      - name: Verify exact scoped authorization and source manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          audit = json.loads(Path("reports/license_audit.json").read_text())
          source = json.loads(Path("data/manifests/knowledge_dense_sources.json").read_text())
          auth = next((x for x in audit.get("candidate_intake_authorizations", [])
                       if x.get("source_id") == "pmc-oa-opendata"
                       and x.get("dataset_revision") == "per-article-version-etag-v1"), None)
          assert audit.get("gate", {}).get("status") == "FAIL"
          assert auth and auth.get("status") == "LIMITED_PASS"
          assert auth.get("candidate_text_downloads_authorized") is True
          assert auth.get("training_eligible") is False and auth.get("admitted") is False
          assert set(auth.get("allowed_licenses", [])) == {"CC0", "CC0 1.0", "CC BY", "CC BY 2.0", "CC BY 3.0", "CC BY 4.0"}
          print("Scoped PMC candidate extraction only; global G-0 remains FAIL.")
          PY
      - name: Prepare candidate libraries with per-version license and XML digest verification
        run: |
          PYTHONPATH=. python scripts/prepare_pmc_oa_candidates.py \
            --domain "$DOMAIN" \
            --max-documents "$MAX_DOCUMENTS" \
            --max-text-bytes "$((MAX_TEXT_MIB * 1024 * 1024))" \
            --min-train-bytes "$((1 * 1024 * 1024))" \
            --output-root "/tmp/ronin-pmc-candidates/$DOMAIN"
      - name: Validate candidate-only state and publish
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ronin-pmc-oa-${{ matrix.domain }}-candidates
          path: /tmp/ronin-pmc-candidates/${{ matrix.domain }}/
          if-no-files-found: warn
          compression-level: 1
          retention-days: 90
      - name: Link run ledger
        if: always()
        uses: ./.github/actions/run-ledger-link
