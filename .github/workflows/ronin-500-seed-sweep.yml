name: RONIN — barrido de 500 semillas sobre currículo sintético de 1 GiB

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ronin-500-seed-sweep.yml
      - scripts/prepare_large_synthetic_corpus.py
      - scripts/run_500_seed_sweep.py
  workflow_dispatch:
    inputs:
      seed_count:
        description: Número de inicializaciones independientes (1-500)
        required: true
        default: "500"
        type: string
      steps_per_seed:
        description: Pasos por inicialización (1-1000)
        required: true
        default: "100"
        type: string
      corpus_gib:
        description: Tamaño del currículo sintético en GiB (1-2)
        required: true
        default: "1"
        type: string

permissions:
  contents: read

concurrency:
  group: ronin-500-seed-sweep
  cancel-in-progress: false

jobs:
  seed-sweep:
    name: 500 semillas — RONIN tiny (9.922.880 parámetros)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
      SEED_COUNT: ${{ inputs.seed_count || '500' }}
      STEPS_PER_SEED: ${{ inputs.steps_per_seed || '100' }}
      CORPUS_GIB: ${{ inputs.corpus_gib || '1' }}
      BASE_SEED: "20261104"
      MMLU_REVISION: "b189ec765aa7ed75c8acfea42df31fdae71f97be"
    steps:
      - name: Obtener RONIN
        uses: actions/checkout@v5

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar PyTorch CPU y evaluadores fijados
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          python -m pip install -e . --no-deps
          python -m pip install "numpy>=1.26" "datasets==3.6.0" "huggingface_hub==0.36.0"

      - name: Validar presupuesto del experimento
        run: |
          [[ "$SEED_COUNT" =~ ^[0-9]+$ ]] && [ "$SEED_COUNT" -ge 1 ] && [ "$SEED_COUNT" -le 500 ]
          [[ "$STEPS_PER_SEED" =~ ^[0-9]+$ ]] && [ "$STEPS_PER_SEED" -ge 1 ] && [ "$STEPS_PER_SEED" -le 1000 ]
          [[ "$CORPUS_GIB" =~ ^[1-2]$ ]]
          mkdir -p reports

      - name: Generar corpus original de entrenamiento (1 GiB por defecto)
        run: |
          PYTHONPATH=. python scripts/prepare_large_synthetic_corpus.py \
            --output /tmp/ronin-seed-sweep-train.txt \
            --target-bytes "$((CORPUS_GIB * 1024 * 1024 * 1024))" \
            --seed 8675309
          PYTHONPATH=. python scripts/prepare_large_synthetic_corpus.py \
            --output /tmp/ronin-seed-sweep-validation.txt \
            --target-bytes $((16 * 1024 * 1024)) \
            --seed 8675310
          test "$(stat -c%s /tmp/ronin-seed-sweep-train.txt)" -ge "$((CORPUS_GIB * 1024 * 1024 * 1024))"
          cp /tmp/ronin-seed-sweep-train.txt.manifest.json reports/train-corpus-manifest.json
          cp /tmp/ronin-seed-sweep-validation.txt.manifest.json reports/validation-corpus-manifest.json

      - name: Ejecutar 500 inicializaciones independientes y medir antes/después
        run: |
          PYTHONPATH=. python scripts/run_500_seed_sweep.py \
            --train-text /tmp/ronin-seed-sweep-train.txt \
            --validation-text /tmp/ronin-seed-sweep-validation.txt \
            --benchmark benchmarks/domains_v1.jsonl \
            --output reports/seed-sweep \
            --seed-count "$SEED_COUNT" \
            --base-seed "$BASE_SEED" \
            --steps "$STEPS_PER_SEED" \
            --top-k 5
          cp reports/seed-sweep/seed-results.jsonl reports/seed-results.jsonl
          cp reports/seed-sweep/seed-sweep-summary.json reports/seed-sweep-summary.json

      - name: Evaluar los cinco mejores candidatos en MMLU-Pro validation (nunca test)
        run: |
          python - <<'PY'
          import json
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          summary = json.loads(Path("reports/seed-sweep-summary.json").read_text(encoding="utf-8"))
          results = []
          for item in summary["best_candidates"]:
              seed = int(item["seed"])
              row = {"seed": seed}
              for phase, key in (("initial", "initial_checkpoint_path"), ("final", "checkpoint_path")):
                  output = Path("reports/mmlu") / f"seed-{seed}-{phase}.json"
                  subprocess.run([
                      sys.executable, "scripts/evaluate_mmlu_pro.py",
                      "--checkpoint", item[key],
                      "--profile", "tiny",
                      "--split", "validation",
                      "--limit", "140",
                      "--seed", "2026",
                      "--revision", __import__("os").environ["MMLU_REVISION"],
                      "--context-length", "2048",
                      "--device", "cpu",
                      "--batch-token-budget", "8192",
                      "--output", str(output),
                  ], check=True)
                  report = json.loads(output.read_text(encoding="utf-8"))
                  row[f"{phase}_accuracy"] = report["overall"]["accuracy"]
                  row[f"{phase}_evaluated_items"] = report["evaluated_items"]
                  row[f"{phase}_dataset_sha256"] = report["dataset_sha256"]
              row["delta_accuracy"] = row["final_accuracy"] - row["initial_accuracy"]
              results.append(row)

          results.sort(key=lambda x: (x["delta_accuracy"], x["final_accuracy"]), reverse=True)
          ranking = {
              "split": "validation",
              "selected_items_per_evaluation": 140,
              "revision": __import__("os").environ["MMLU_REVISION"],
              "ranking": results,
              "best_seed": results[0]["seed"] if results else None,
              "test_split_used": False,
              "note": "Development ranking only; repeated candidate comparison can overfit validation. Final release test remains untouched.",
          }
          Path("reports/mmlu-validation-ranking.json").write_text(
              json.dumps(ranking, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          if results:
              source = Path("reports/seed-sweep/best-candidates") / f"seed-{results[0]['seed']}-final.pt"
              shutil.copy2(source, Path("reports/best-model.pt"))
          print(json.dumps(ranking, ensure_ascii=False, indent=2))
          PY

      - name: Publicar informe, hashes y mejor checkpoint exploratorio
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ronin-500-seed-sweep-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          compression-level: 1
          retention-days: 30

      - name: Enlazar libro de runs
        if: always()
        uses: ./.github/actions/run-ledger-link
