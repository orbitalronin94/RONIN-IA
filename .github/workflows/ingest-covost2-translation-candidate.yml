name: Ingest CoVoST 2 translation-only candidate

on:
  workflow_dispatch:
    inputs:
      max_rows:
        description: Maximum unique translation rows
        required: false
        default: "500000"
  schedule:
    - cron: "23 4 5 * *"

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build translation-only candidate and hash evidence
        run: |
          python scripts/ingest_covost2_translation_only.py --max-rows "${{ inputs.max_rows || '500000' }}"
      - name: Validate proposed rights record
        run: python scripts/validate_rights_registry.py --record artifacts/covost/rights-record.candidate.json
      - uses: actions/upload-artifact@v6
        with:
          name: ronin-covost2-translation-only-candidate
          path: artifacts/covost/
          if-no-files-found: error
          retention-days: 90
