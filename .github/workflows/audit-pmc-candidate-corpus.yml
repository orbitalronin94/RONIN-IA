name: Audit PMC candidate rights and quality screens

on:
  push:
    branches: [main]
    paths:
      - "scripts/audit_pmc_candidate_manifest.py"
      - "scripts/verify_pmc_oa_candidate_corpus.py"
      - "scripts/harvest_pmc_oa_cc0_ccby.py"
      - "data/datasets/candidates/pmc-oa-cc0-ccby-v2/manifest.jsonl"
      - "data/datasets/candidates/pmc-oa-cc0-ccby-v2/part-*.jsonl.gz"
      - ".github/workflows/audit-pmc-candidate-corpus.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audit-pmc-candidate-corpus-main
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify candidate shard hashes and exact text totals
        run: python scripts/verify_pmc_oa_candidate_corpus.py
      - name: Audit editorial notices and exact license versions
        run: python scripts/audit_pmc_candidate_manifest.py
      - name: Publish audit report artifact
        uses: actions/upload-artifact@v4
        with:
          name: ronin-pmc-candidate-rights-audit
          path: |
            data/datasets/candidates/pmc-oa-cc0-ccby-v2/corpus-verification.json
            data/datasets/reviews/pmc-candidate-screen-2026-11-06.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 1
      - name: Persist reproducible audit summary to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/datasets/candidates/pmc-oa-cc0-ccby-v2/corpus-verification.json data/datasets/reviews/pmc-candidate-screen-2026-11-06.json
          if git diff --cached --quiet; then
            echo "PMC candidate audit is unchanged."
            exit 0
          fi
          git commit -m "data: persist PMC candidate rights audit"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((2 ** attempt))
          done
          echo "Could not persist PMC audit after three backoff retries." >&2
          exit 1
