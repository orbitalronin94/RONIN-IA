name: Experimento oficial RONIN desde cero + MMLU-Pro completo

on:
  workflow_dispatch:
    inputs:
      steps:
        description: Pasos de entrenamiento (1-1000)
        required: true
        default: "1000"
        type: string
      seeds:
        description: Una semilla para el holdout completo (máximo 5 en muestras parciales)
        required: true
        default: "1337"
        type: string
      mmlu_limit:
        description: Preguntas MMLU-Pro (0 usa el test completo de 12.032 preguntas)
        required: true
        default: "0"
        type: string
      mmlu_batch_token_budget:
        description: Presupuesto de tokens padded por lote del evaluador (512-32768)
        required: false
        default: "8192"
        type: string
      candidate_run_id:
        description: ID del workflow RUN 5 que publicó las 32 bibliotecas admitidas
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ronin-official-full-mmlu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ronin-training:
    name: Entrenar solo después de admitir las 32 bibliotecas
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
      MMLU_REVISION: "b189ec765aa7ed75c8acfea42df31fdae71f97be"
      # Ejecución manual: test externo completo con una semilla tras superar el gate de 32 bibliotecas.
      STEPS: ${{ inputs.steps || '1000' }}
      SEEDS: ${{ inputs.seeds || '1337' }}
      MMLU_LIMIT: ${{ inputs.mmlu_limit || '0' }}
      MMLU_BATCH_TOKEN_BUDGET: ${{ inputs.mmlu_batch_token_budget || '8192' }}
    steps:
      - name: Obtener RONIN IA
        uses: actions/checkout@v5

      - name: Validar ID de ejecución de preparación
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          if ! [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::candidate_run_id debe ser el ID numérico del workflow de preparación."
            exit 1
          fi

      - name: Descargar los 16 artefactos de bibliotecas de esa ejecución
        uses: actions/download-artifact@v6
        with:
          pattern: ronin-datasets-run5-library-*
          path: /tmp/ronin-run5-library-artifacts
          merge-multiple: false
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}

      - name: Materializar cada artefacto en el layout del gate oficial
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          source = Path("/tmp/ronin-run5-library-artifacts")
          target = Path("/tmp/ronin-sixteen-libraries")
          target.mkdir(parents=True, exist_ok=True)
          expected = {
              "mathematics_general",
              "logic_epistemology_general",
              "philosophy_general",
              "physics_general",
              "chemistry_materials_general",
              "biology_general",
              "medicine_health_general",
              "computer_science_general",
              "software_engineering_general",
              "law_general",
              "economics_general",
              "social_sciences_general",
              "statistics_probability_general",
              "astronomy_earth_science_general",
              "engineering_robotics_general",
              "humanities_general",
              "mathematics_hkd",
              "logic_epistemology_hkd",
              "philosophy_hkd",
              "physics_hkd",
              "chemistry_materials_hkd",
              "biology_hkd",
              "medicine_health_hkd",
              "computer_science_hkd",
              "software_engineering_hkd",
              "law_hkd",
              "economics_hkd",
              "social_sciences_hkd",
              "statistics_probability_hkd",
              "astronomy_earth_science_hkd",
              "engineering_robotics_hkd",
              "humanities_hkd",
          }
          found = set()
          for artifact in source.iterdir():
              manifest = artifact / "candidate-manifest.json"
              if not manifest.is_file():
                  continue
              item = json.loads(manifest.read_text(encoding="utf-8"))
              library_id = item["id"]
              if library_id not in expected or library_id in found:
                  raise SystemExit(f"Artefacto inesperado o duplicado: {library_id}")
              shutil.copytree(artifact, target / library_id)
              found.add(library_id)
          missing = sorted(expected - found)
          if missing:
              raise SystemExit(f"Faltan bibliotecas del run {__import__('os').environ.get('CANDIDATE_RUN_ID','')}: {missing}")
          print(f"Materializadas {len(found)}/32 bibliotecas.")
          PY

      - name: Preflight fail-fast de RUN 5 antes de descargar dependencias
        run: |
          python scripts/check_run5_preflight.py \
            --corpus-root /tmp/ronin-sixteen-libraries \
            --report reports/run5-preflight.json

      - name: Publicar diagnóstico del preflight aunque el gate bloquee
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ronin-run5-readiness-preflight
          path: reports/run5-preflight.json
          if-no-files-found: warn
          retention-days: 30

      - name: Obtener Portfolio en revisión inmutable para recuperación
        uses: actions/checkout@v5
        with:
          repository: orbitalronin94/Portfolio
          ref: fffc234fdf3f82b6a90d56ae9b190d1c0de79690
          path: data/source/portfolio

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar PyTorch CPU, RONIN y evaluador externo
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          python -m pip install -e . --no-deps
          python -m pip install "numpy>=1.26" "PyYAML>=6.0" "tqdm>=4.66" "pypdf>=5" "datasets==3.6.0" "huggingface_hub==0.36.0"
          python - <<'PY'
          import datasets
          import huggingface_hub
          from datasets import load_dataset
          print("Evaluador externo listo:", datasets.__version__, huggingface_hub.__version__)
          PY

      - name: Preparar Portfolio como índice RAG (nunca como entrenamiento)
        run: |
          python scripts/prepare_portfolio_corpus.py \
            --source-dir data/source/portfolio/Papers \
            --output-dir /tmp/ronin-portfolio-rag/source \
            --source-revision fffc234fdf3f82b6a90d56ae9b190d1c0de79690
          python scripts/build_portfolio_rag_index.py \
            --source-dir /tmp/ronin-portfolio-rag/source \
            --output-dir /tmp/ronin-portfolio-rag

      - name: "Gate obligatorio: 32 bibliotecas admitidas antes del entrenamiento oficial"
        run: python scripts/validate_sixteen_libraries.py --require-ready --corpus-root /tmp/ronin-sixteen-libraries --portfolio-root /tmp/ronin-portfolio-rag

      - name: Construir mezcla balanceada de las 32 bibliotecas admitidas
        run: |
          python scripts/prepare_training_mixture.py \
                        --input mathematics_general=/tmp/ronin-sixteen-libraries/mathematics_general/train.txt \
            --input logic_epistemology_general=/tmp/ronin-sixteen-libraries/logic_epistemology_general/train.txt \
            --input philosophy_general=/tmp/ronin-sixteen-libraries/philosophy_general/train.txt \
            --input physics_general=/tmp/ronin-sixteen-libraries/physics_general/train.txt \
            --input chemistry_materials_general=/tmp/ronin-sixteen-libraries/chemistry_materials_general/train.txt \
            --input biology_general=/tmp/ronin-sixteen-libraries/biology_general/train.txt \
            --input medicine_health_general=/tmp/ronin-sixteen-libraries/medicine_health_general/train.txt \
            --input computer_science_general=/tmp/ronin-sixteen-libraries/computer_science_general/train.txt \
            --input software_engineering_general=/tmp/ronin-sixteen-libraries/software_engineering_general/train.txt \
            --input law_general=/tmp/ronin-sixteen-libraries/law_general/train.txt \
            --input economics_general=/tmp/ronin-sixteen-libraries/economics_general/train.txt \
            --input social_sciences_general=/tmp/ronin-sixteen-libraries/social_sciences_general/train.txt \
            --input statistics_probability_general=/tmp/ronin-sixteen-libraries/statistics_probability_general/train.txt \
            --input astronomy_earth_science_general=/tmp/ronin-sixteen-libraries/astronomy_earth_science_general/train.txt \
            --input engineering_robotics_general=/tmp/ronin-sixteen-libraries/engineering_robotics_general/train.txt \
            --input humanities_general=/tmp/ronin-sixteen-libraries/humanities_general/train.txt \
            --input mathematics_hkd=/tmp/ronin-sixteen-libraries/mathematics_hkd/train.txt \
            --input logic_epistemology_hkd=/tmp/ronin-sixteen-libraries/logic_epistemology_hkd/train.txt \
            --input philosophy_hkd=/tmp/ronin-sixteen-libraries/philosophy_hkd/train.txt \
            --input physics_hkd=/tmp/ronin-sixteen-libraries/physics_hkd/train.txt \
            --input chemistry_materials_hkd=/tmp/ronin-sixteen-libraries/chemistry_materials_hkd/train.txt \
            --input biology_hkd=/tmp/ronin-sixteen-libraries/biology_hkd/train.txt \
            --input medicine_health_hkd=/tmp/ronin-sixteen-libraries/medicine_health_hkd/train.txt \
            --input computer_science_hkd=/tmp/ronin-sixteen-libraries/computer_science_hkd/train.txt \
            --input software_engineering_hkd=/tmp/ronin-sixteen-libraries/software_engineering_hkd/train.txt \
            --input law_hkd=/tmp/ronin-sixteen-libraries/law_hkd/train.txt \
            --input economics_hkd=/tmp/ronin-sixteen-libraries/economics_hkd/train.txt \
            --input social_sciences_hkd=/tmp/ronin-sixteen-libraries/social_sciences_hkd/train.txt \
            --input statistics_probability_hkd=/tmp/ronin-sixteen-libraries/statistics_probability_hkd/train.txt \
            --input astronomy_earth_science_hkd=/tmp/ronin-sixteen-libraries/astronomy_earth_science_hkd/train.txt \
            --input engineering_robotics_hkd=/tmp/ronin-sixteen-libraries/engineering_robotics_hkd/train.txt \
            --input humanities_hkd=/tmp/ronin-sixteen-libraries/humanities_hkd/train.txt \ \
            --output /tmp/ronin-training/combined-train.txt \
            --manifest reports/training-mixture.json
      - name: Validar presupuesto, semillas y muestra externa
        run: |
          if ! [[ "$STEPS" =~ ^[0-9]+$ ]] || [ "$STEPS" -lt 1 ] || [ "$STEPS" -gt 1000 ]; then
            echo "::error::Los pasos deben estar entre 1 y 1000."
            exit 1
          fi
          if ! [[ "$MMLU_LIMIT" =~ ^[0-9]+$ ]] || [ "$MMLU_LIMIT" -gt 12032 ]; then
            echo "::error::MMLU_LIMIT debe ser 0 o estar entre 1 y 12032."
            exit 1
          fi
          if ! [[ "$MMLU_BATCH_TOKEN_BUDGET" =~ ^[0-9]+$ ]] || [ "$MMLU_BATCH_TOKEN_BUDGET" -lt 512 ] || [ "$MMLU_BATCH_TOKEN_BUDGET" -gt 32768 ]; then
            echo "::error::MMLU_BATCH_TOKEN_BUDGET debe estar entre 512 y 32768."
            exit 1
          fi
          if ! [[ "$SEEDS" =~ ^[0-9]+(,[0-9]+)*$ ]]; then
            echo "::error::Formato de semillas no válido."
            exit 1
          fi
          IFS=',' read -ra seed_values <<< "$SEEDS"
          if [ "${#seed_values[@]}" -gt 5 ]; then
            echo "::error::Máximo cinco semillas."
            exit 1
          fi
          if [ "$MMLU_LIMIT" -eq 0 ] && [ "${#seed_values[@]}" -ne 1 ]; then
            echo "::error::El test completo de MMLU-Pro requiere una sola semilla por ejecución."
            exit 1
          fi
          declare -A seen
          for seed in "${seed_values[@]}"; do
            if [ -n "${seen[$seed]+x}" ]; then
              echo "::error::Semilla duplicada: $seed"
              exit 1
            fi
            seen[$seed]=1
          done
          mkdir -p reports

      - name: Entrenar desde cero y evaluar el test externo completo antes/después
        run: |
          IFS=',' read -ra seed_values <<< "$SEEDS"
          for seed in "${seed_values[@]}"; do
            echo "::group::Semilla $seed"
            report_dir="reports/seed-$seed"
            checkpoint_dir="/tmp/ronin-training/checkpoints/seed-$seed"
            initial_checkpoint="/tmp/ronin-training/inicial-seed-$seed.pt"
            mkdir -p "$report_dir" "$checkpoint_dir"

            SEED="$seed" INITIAL_CHECKPOINT="$initial_checkpoint" python - <<'PY'
          import os
          import torch
          from ronin.config import get_profile
          from ronin.models.transformer import RoninLM
          from ronin.utils.repro import seed_everything

          config, _ = get_profile("tiny")
          seed = int(os.environ["SEED"])
          seed_everything(seed)
          model = RoninLM(config)
          torch.save(
              {"model": model.state_dict(), "step": 0},
              os.environ["INITIAL_CHECKPOINT"],
          )
          print(f"Referencia inicial: seed={seed}, parámetros={model.parameter_count}")
          PY

            python scripts/evaluate_mmlu_pro.py \
              --checkpoint "$initial_checkpoint" \
              --profile tiny --context-length 2048 \
              --limit "$MMLU_LIMIT" --seed 2026 \
              --revision "$MMLU_REVISION" --device cpu \
              --batch-token-budget "$MMLU_BATCH_TOKEN_BUDGET" \
              --output "$report_dir/mmlu-inicial.json"

            python scripts/train_text.py \
              --text /tmp/ronin-training/combined-train.txt \
              --profile tiny --steps "$STEPS" --seed "$seed" \
              --device cpu --checkpoints "$checkpoint_dir"

            checkpoint="$checkpoint_dir/step-$(printf '%08d' "$STEPS").pt"
            test -s "$checkpoint"

            python scripts/evaluate_mmlu_pro.py \
              --checkpoint "$checkpoint" \
              --profile tiny --context-length 2048 \
              --limit "$MMLU_LIMIT" --seed 2026 \
              --revision "$MMLU_REVISION" --device cpu \
              --batch-token-budget "$MMLU_BATCH_TOKEN_BUDGET" \
              --output "$report_dir/mmlu-final.json"

            echo "::endgroup::"
          done

      - name: Exportar pesos finales y manifiestos de procedencia por semilla
        run: |
          IFS=',' read -ra seed_values <<< "$SEEDS"
          for seed in "${seed_values[@]}"; do
            checkpoint="/tmp/ronin-training/checkpoints/seed-$seed/step-$(printf '%08d' "$STEPS").pt"
            python scripts/export_run5_weights.py \
              --checkpoint "$checkpoint" \
              --output "artifacts/weights/seed-$seed/ronin-tiny-seed-$seed-step-$STEPS.pt" \
              --manifest "artifacts/weights/seed-$seed/weights-manifest.json" \
              --training-manifest reports/training-mixture.json \
              --initial-eval "reports/seed-$seed/mmlu-inicial.json" \
              --final-eval "reports/seed-$seed/mmlu-final.json" \
              --profile tiny --seed "$seed" --steps "$STEPS"
          done

      - name: Consolidar métricas, cobertura y procedencia
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          mixture_manifest = json.loads(
              Path("reports/training-mixture.json").read_text(encoding="utf-8")
          )
          rows = []
          for initial_path in sorted(Path("reports").glob("seed-*/mmlu-inicial.json")):
              seed_dir = initial_path.parent
              initial = json.loads(initial_path.read_text(encoding="utf-8"))
              final = json.loads((seed_dir / "mmlu-final.json").read_text(encoding="utf-8"))
              assert initial["dataset_revision"] == os.environ["MMLU_REVISION"]
              assert final["dataset_revision"] == os.environ["MMLU_REVISION"]
              assert initial["dataset_sha256"] == final["dataset_sha256"]
              assert initial["selected_items"] == final["selected_items"]
              if int(os.environ["MMLU_LIMIT"]) == 0:
                  assert initial["selected_items"] == 12032, initial["selected_items"]
                  assert final["selected_items"] == 12032, final["selected_items"]
              rows.append({
                  "seed": seed_dir.name.removeprefix("seed-"),
                  "initial": {
                      "accuracy": initial["overall"]["accuracy"],
                      "correct": initial["overall"]["correct"],
                      "evaluated": initial["evaluated_items"],
                      "selected": initial["selected_items"],
                      "coverage": initial["coverage"],
                      "skipped_context_items": initial["skipped_context_items"],
                      "by_domain": initial["by_domain"],
                      "checkpoint_sha256": initial["checkpoint_sha256"],
                  },
                  "final": {
                      "accuracy": final["overall"]["accuracy"],
                      "correct": final["overall"]["correct"],
                      "evaluated": final["evaluated_items"],
                      "selected": final["selected_items"],
                      "coverage": final["coverage"],
                      "skipped_context_items": final["skipped_context_items"],
                      "by_domain": final["by_domain"],
                      "checkpoint_sha256": final["checkpoint_sha256"],
                  },
                  "delta_accuracy": final["overall"]["accuracy"] - initial["overall"]["accuracy"],
              })

          summary = {
              "experiment": "ronin-official-training-mmlu-pro-full-v1",
              "steps_per_seed": int(os.environ["STEPS"]),
              "mmlu_batch_token_budget": int(os.environ["MMLU_BATCH_TOKEN_BUDGET"]),
              "seeds": os.environ["SEEDS"].split(","),
              "training_corpora": {
                  "libraries": [
                      {
                          "id": library["id"],
                          "revision": library["revision"],
                          "train_bytes": library["train_bytes"],
                          "train_sha256": library["train_sha256"],
                          "manifest_sha256": library["manifest_sha256"],
                      }
                      for library in json.loads(
                          Path("data/manifests/sixteen_libraries.json").read_text(encoding="utf-8")
                      )["libraries"]
                  ],
                  "portfolio": {"used_for_training": False, "role": "retrieval_only_fallback"},
                  "mixture": mixture_manifest,
              },
              "evaluation": {
                  "dataset_id": "TIGER-Lab/MMLU-Pro",
                  "dataset_revision": os.environ["MMLU_REVISION"],
                  "split": "test",
                  "limit_per_seed": int(os.environ["MMLU_LIMIT"]),
                  "expected_full_test_items": 12032 if int(os.environ["MMLU_LIMIT"]) == 0 else None,
                  "sampling_seed": 2026,
                  "protocol": "RONIN zero-shot por probabilidad del siguiente byte A-J; no comparable con leaderboard oficial",
                  "used_for_training": False,
              },
              "cycles": rows,
              "interpretation": [
                  "Portfolio/Papers está excluido de pretraining y SFT; queda reservado para recuperación RAG con citas.",
                  "El entrenamiento oficial está bloqueado hasta que las 32 bibliotecas independientes superen el gate de licencia, procedencia, tamaño y calidad.",
                  "MMLU-Pro test se utiliza solo para evaluación antes/después y nunca para gradientes.",
                  "La mezcla contiene exclusivamente las 32 bibliotecas admitidas y hasheadas; Portfolio queda fuera.",
                  "Los splits validation/test de literatura, MMLU-Pro test, el piloto interno y los casos criptográficos pendientes de revisión no se mezclan con train.",
                  "La biblioteca criptográfica sigue en cuarentena manual; los datos sintéticos y las generaciones de tutores no se consideran corpus de conocimiento para esta primera prueba.",
                  "Cada semilla parte de inicialización aleatoria y usa la misma semilla para su entrenamiento independiente.",
                  "Se comparan exactamente los mismos ítems MMLU-Pro en el estado inicial y final.",
                  "El protocolo de siguiente byte no es la evaluación oficial de MMLU-Pro ni permite comparar con su leaderboard.",
                  "Una mejora o empeoramiento en esta muestra no demuestra por sí sola capacidad general ni causalidad.",
              ],
          }
          Path("reports/resumen-ronin-mmlu.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({
              "seeds": summary["seeds"],
              "delta_accuracy": {row["seed"]: row["delta_accuracy"] for row in rows},
              "coverage": {row["seed"]: row["final"]["coverage"] for row in rows},
              "summary": "reports/resumen-ronin-mmlu.json",
          }, ensure_ascii=False, indent=2))
          PY

      - name: Publicar pesos finales reproducibles del estudiante
        uses: actions/upload-artifact@v6
        with:
          name: ronin-run5-model-weights
          path: artifacts/weights/
          if-no-files-found: error
          compression-level: 6
          retention-days: 90

      - name: Publicar informes y manifiestos sin corpus ni checkpoints
        uses: actions/upload-artifact@v6
        with:
          name: ronin-official-full-mmlu-training-cycle
          path: reports/
          if-no-files-found: error
          retention-days: 30

      - name: Enlazar libro de runs
        if: always()
        uses: ./.github/actions/run-ledger-link
