name: Audit fusion candidates

on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Audit four candidate repositories
        id: audit
        continue-on-error: true
        run: python3 scripts/audit_fusion_candidates.py
      - name: Publish audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ronin-fusion-audit
          path: fusion-audit-report.json
          if-no-files-found: warn
          retention-days: 30
