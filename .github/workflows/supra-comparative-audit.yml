name: Auditoría comparativa Supra → RONIN

on:
  workflow_run:
    workflows: ["Experimento oficial RONIN desde cero + MMLU-Pro completo"]
    types: [completed]
  workflow_dispatch:
    inputs:
      baseline_run_id:
        description: ID de la ejecución oficial ya completada
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  compare:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obtener RONIN IA
        uses: actions/checkout@v5

      - name: Resolver ejecución base
        id: baseline
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_RUN_ID: ${{ inputs.baseline_run_id }}
          COMPLETED_RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            run_id="$DISPATCH_RUN_ID"
          else
            run_id="$COMPLETED_RUN_ID"
          fi
          [[ "$run_id" =~ ^[0-9]+$ ]]
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json status,conclusion,workflowName
          status="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json status --jq .status)"
          conclusion="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)"
          workflow="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json workflowName --jq .workflowName)"
          test "$status" = completed
          test "$conclusion" = success
          test "$workflow" = "Experimento oficial RONIN desde cero + MMLU-Pro completo"

      - name: Descargar artefacto exacto de la línea base
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.baseline.outputs.run_id }}
        run: |
          mkdir -p baseline
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name ronin-official-full-mmlu-training-cycle --dir baseline
          test -s baseline/resumen-portfolio-mmlu.json

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validar línea base y comparar catálogo Supra
        run: |
          python scripts/compare_supra_baseline.py \
            --baseline baseline/resumen-portfolio-mmlu.json \
            --specs data/manifests/supra_specs.json \
            --out reports/supra-baseline-crosswalk.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("reports/supra-baseline-crosswalk.json").read_text())
          lines = [
              "# Comparación línea base RONIN × 50 propuestas Supra",
              "",
              f"- Experimento base: `{data['baseline_experiment']}`",
              f"- Semillas: {', '.join(data['baseline_seeds'])}",
              f"- Pasos/semilla: {data['baseline_steps_per_seed']}",
              f"- Propuestas: {data['proposal_count']}",
              f"- Revisión MMLU-Pro: `{data['mmlu_revision']}`",
              "",
              "## Estado inicial de propuestas",
              "",
              "| Estado | Nº |",
              "|---|---:|",
          ]
          for status, count in data["proposal_status_counts"].items():
              lines.append(f"| {status} | {count} |")
          lines += ["", "## Cambios medidos en la línea base", ""]
          for cycle in data["baseline_cycles"]:
              before, after = cycle["initial"], cycle["final"]
              lines.append(
                  f"- Semilla {cycle['seed']}: accuracy "
                  f"{before['accuracy']:.6f} → {after['accuracy']:.6f} "
                  f"(Δ {cycle['delta_accuracy']:+.6f}); cobertura "
                  f"{before['coverage']:.4f} → {after['coverage']:.4f}."
              )
          lines += [
              "", "## Interpretación", "",
              data["conclusion"], "",
              "Las propuestas son hipótesis; no se han implementado ni añadido al corpus.",
              "Las referencias [NV] y los textos con derechos pendientes permanecen bloqueados.",
              ""
          ]
          Path("reports/supra-comparacion.md").write_text("\n".join(lines), encoding="utf-8")
          PY

      - name: Publicar informe comparativo
        uses: actions/upload-artifact@v6
        with:
          name: ronin-supra-baseline-comparison
          path: reports/
          if-no-files-found: error
          retention-days: 30

      - name: Enlazar libro de runs
        if: always()
        uses: ./.github/actions/run-ledger-link
