name: Incorporar corpus científicos CC-BY verificados

on:
  push:
    paths:
      - ".github/workflows/ingest-scienceverse-ccby.yml"
      - "scripts/ingest_scienceverse_ccby.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ronin-scienceverse-ccby-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Descargar paperlists completos y auditar licencias de cada DOI
        run: python scripts/ingest_scienceverse_ccby.py
      - name: Registrar y subir archivos de corpus a main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/datasets/admitted/scienceverse
          git commit -m "data: admit ScienceVerse CC-BY full-text paperlists"
          git push origin HEAD:main
