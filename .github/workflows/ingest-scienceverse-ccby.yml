name: Incorporar corpus científicos CC-BY verificados

on:
  push:
    paths:
      - ".github/workflows/ingest-scienceverse-ccby.yml"
      - "scripts/ingest_scienceverse_ccby.py"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: ronin-scienceverse-ccby-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Descargar paperlists completos y auditar licencias de cada DOI
        run: python scripts/ingest_scienceverse_ccby.py
      - name: Registrar y subir archivos de corpus a main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/datasets/candidates/scienceverse-fulltext
          git commit -m "data: add ScienceVerse CC-BY full-text candidates"
          # The repository's run-ledger workflow writes commits to main after
          # other workflows finish. Wait for those writes to settle before pushing.
          for attempt in $(seq 1 20); do
            pending=$(gh run list --workflow run-ledger.yml --limit 30 --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "pending")] | length')
            if [ "$pending" = "0" ]; then
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Unable to push candidate payload after waiting for run-ledger writes" >&2
          exit 1
