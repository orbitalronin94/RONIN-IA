name: Generar candidatos REF con Phi-4 (sin entrenar al estudiante)

on:
  workflow_run:
    workflows: ["Preparar caché de tutores locales"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ronin-phi4-candidate-generation
  cancel-in-progress: false

jobs:
  generate-candidates:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Obtener RONIN IA
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Restaurar caché verificado de tutores
        uses: actions/cache@v4
        with:
          path: models/teachers
          key: ronin-teachers-${{ runner.os }}-${{ hashFiles('scripts/download_teacher_models.py') }}

      - name: Instalar entorno nativo Phi-4
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.5.1"
          python -m pip install -e . --no-deps
          python -m pip install "transformers==4.53.3" "huggingface_hub==0.36.0" "safetensors>=0.4" "accelerate==1.3.0"
          python -m pip check
          python - <<'PY'
          import torch
          import transformers
          from transformers.utils import LossKwargs
          print("Entorno:", torch.__version__, transformers.__version__, LossKwargs.__name__)
          PY

      - name: Descargar Phi-4 si la caché no está disponible
        run: |
          if [ ! -f models/teachers/phi-4-mini-instruct/ronin-teacher-manifest.json ]; then
            python scripts/download_teacher_models.py --model phi-4-mini-instruct
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path(
              "models/teachers/phi-4-mini-instruct/ronin-teacher-manifest.json"
          ).read_text(encoding="utf-8"))
          assert manifest["model_id"] == "microsoft/Phi-4-mini-instruct"
          assert manifest["license"] == "mit" and manifest["license_verified"] is True
          assert manifest["trust_remote_code"] is False
          assert manifest["revision"] == "cfbefacb99257ffa30c83adab238a50856ac3083"
          assert any(Path("models/teachers/phi-4-mini-instruct").rglob("*.safetensors"))
          print("Phi-4 verificado:", manifest["revision"])
          PY

      - name: Generar propuestas REF localmente
        run: |
          mkdir -p /tmp/ronin-teacher reports
          python scripts/generate_teacher_data.py \
            --model-dir models/teachers/phi-4-mini-instruct \
            --count 16 --device cpu --max-new-tokens 256 --seed 404 \
            --output /tmp/ronin-teacher/phi-4-mini-instruct.jsonl

      - name: Auditar estructura de las propuestas; no certificar veracidad
        run: |
          python scripts/audit_ref_dataset.py \
            --input /tmp/ronin-teacher/phi-4-mini-instruct.jsonl \
            --report reports/teacher-ref-audit.json \
            --accepted-output /tmp/ronin-teacher/phi-4-ref-valid.jsonl
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          audit = json.loads(Path("reports/teacher-ref-audit.json").read_text(encoding="utf-8"))
          raw = Path("/tmp/ronin-teacher/phi-4-mini-instruct.jsonl").read_bytes()
          assert audit["records"] == 16
          assert audit["valid_records"] >= 4, audit
          summary = {
              "model_id": "microsoft/Phi-4-mini-instruct",
              "model_revision": "cfbefacb99257ffa30c83adab238a50856ac3083",
              "model_license": "MIT",
              "generated_records": audit["records"],
              "structurally_valid_records": audit["valid_records"],
              "structural_validity_rate": audit["structural_validity_rate"],
              "candidate_sha256": hashlib.sha256(raw).hexdigest(),
              "output_license": "not_asserted",
              "used_for_training": False,
              "manual_quality_and_rights_review_required": True,
              "limitations": [
                  "REF valida estructura y etiquetas, no veracidad factual.",
                  "No se publica el texto generado ni se mezcla con el estudiante.",
              ],
          }
          Path("reports/teacher-candidate-summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Publicar solo auditoría y metadatos, no las generaciones
        uses: actions/upload-artifact@v4
        with:
          name: ronin-phi4-candidate-audit
          path: |
            reports/teacher-ref-audit.json
            reports/teacher-candidate-summary.json
          if-no-files-found: error
          retention-days: 30
      - name: Enlazar libro de runs
        if: always()
        uses: ./.github/actions/run-ledger-link
