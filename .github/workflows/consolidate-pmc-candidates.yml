name: Consolidate 3,040+ PMC dataset candidates

on:
  workflow_run:
    workflows: ["Expand scientific datasets — PMC OA CC0/CC-BY candidates"]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: ronin-pmc-candidate-consolidation
  cancel-in-progress: false

jobs:
  consolidate:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Download completed domain shards
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v6
        with:
          pattern: ronin-pmc-oa-*-candidates
          path: incoming
          merge-multiple: false
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Record that the source run published no candidate artifacts
        if: ${{ steps.download.outcome != 'success' }}
        run: |
          echo "No PMC candidate artifacts were published by source run ${{ github.event.workflow_run.id }}; consolidation is skipped without inventing an empty corpus."

      - name: Aggregate, verify and count globally unique documents
        id: aggregate
        if: ${{ steps.download.outcome == 'success' }}
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          python scripts/aggregate_pmc_candidate_shards.py \
            --input-root incoming \
            --output-root "data/datasets/candidates/pmc-oa-expansion-${SOURCE_RUN_ID}" \
            --run-id "$SOURCE_RUN_ID" \
            --minimum 3040

      - name: Publish candidate package and audit manifest
        if: ${{ steps.aggregate.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: ronin-pmc-oa-multidomain-${{ github.event.workflow_run.id }}
          path: |
            incoming/
            data/datasets/candidates/pmc-oa-expansion-${{ github.event.workflow_run.id }}/manifest.json
          if-no-files-found: error
          compression-level: 1
          retention-days: 90

      - name: Commit dataset index to main
        if: ${{ steps.aggregate.outcome == 'success' }}
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "data/datasets/candidates/pmc-oa-expansion-${SOURCE_RUN_ID}/manifest.json"
          if git diff --cached --quiet; then
            echo "No candidate manifest to commit."
          else
            git commit -m "data: index PMC multidomain candidate expansion"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Enforce complete domain coverage and the 3,040-document target
        if: always()
        run: |
          if [ "${{ steps.download.outcome }}" != "success" ]; then
            echo "::error::No se descargaron artefactos de candidato PMC."
            exit 1
          fi
          if [ "${{ steps.aggregate.outcome }}" != "success" ]; then
            echo "::error::No se pudo verificar el manifiesto agregado PMC."
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/datasets/candidates/pmc-oa-expansion-${{ github.event.workflow_run.id }}/manifest.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          assert report["all_expected_domains_present"], report["missing_expected_domains"]
          assert report["complete_general_hkd_pairing"], "Falta una biblioteca General/HKD"
          assert report["minimum_target_met"], "No se alcanzaron 3.040 textos únicos sin duplicados"
          assert report["cross_domain_or_library_exact_duplicates"] == 0
          print("Cobertura y objetivo mínimo verificados; sigue siendo candidato, no admitido.")
          PY
