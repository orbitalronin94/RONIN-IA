name: Consolidate 3,040+ PMC dataset candidates

on:
  workflow_run:
    workflows: ["Expand scientific datasets — PMC OA CC0/CC-BY candidates"]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: ronin-pmc-candidate-consolidation
  cancel-in-progress: false

jobs:
  consolidate:
    if: \${{ github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Download completed domain shards
        uses: actions/download-artifact@v6
        with:
          pattern: ronin-pmc-oa-*-candidates
          path: incoming
          merge-multiple: false
          run-id: \${{ github.event.workflow_run.id }}
          github-token: \${{ secrets.GITHUB_TOKEN }}

      - name: Aggregate, verify and count globally unique documents
        env:
          SOURCE_RUN_ID: \${{ github.event.workflow_run.id }}
        run: |
          mkdir -p "data/datasets/candidates/pmc-oa-expansion-\${SOURCE_RUN_ID}" consolidated
          cp -a incoming/. consolidated/shards/ 2>/dev/null || true
          python scripts/aggregate_pmc_candidate_shards.py \
            --input-root incoming \
            --output-root "data/datasets/candidates/pmc-oa-expansion-\${SOURCE_RUN_ID}" \
            --run-id "$SOURCE_RUN_ID" \
            --minimum 3040

      - name: Publish complete candidate package
        uses: actions/upload-artifact@v6
        with:
          name: ronin-pmc-oa-multidomain-\${{ github.event.workflow_run.id }}
          path: |
            incoming/
            data/datasets/candidates/pmc-oa-expansion-\${{ github.event.workflow_run.id }}/manifest.json
          if-no-files-found: warn
          compression-level: 1
          retention-days: 90

      - name: Commit dataset index to main
        env:
          SOURCE_RUN_ID: \${{ github.event.workflow_run.id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "data/datasets/candidates/pmc-oa-expansion-\${SOURCE_RUN_ID}/manifest.json"
          if git diff --cached --quiet; then
            echo "No candidate manifest to commit."
          else
            git commit -m "data: index PMC multidomain candidate expansion"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
