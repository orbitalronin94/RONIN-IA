name: Inspect ScienceVerse RDS structure

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/inspect_scienceverse_rds.R"
      - ".github/workflows/inspect-scienceverse-rds.yml"
      - "data/datasets/candidates/scienceverse-fulltext/**"

permissions:
  contents: read

concurrency:
  group: ronin-scienceverse-rds-inspection
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Install R runtime and system jsonlite package
        run: |
          sudo apt-get update
          sudo apt-get install -y r-base r-cran-jsonlite
          Rscript -e 'stopifnot(requireNamespace("jsonlite", quietly=TRUE))'
      - name: Verify payload, manifests and inspect all RDS objects
        run: Rscript scripts/inspect_scienceverse_rds.R
      - name: Summarize verified RDS structures
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = Path("scienceverse-rds-inspection/structure-report.json")
          if not report.exists():
              print("No structure report was produced.")
              raise SystemExit(0)
          data = json.loads(report.read_text(encoding="utf-8"))
          print(f"Status: {data['status']}")
          for name, item in data.get("datasets", {}).items():
              print(f"{name}: {item['eligible_rows']} eligible DOI rows; {item['payload_bytes']} bytes; SHA-256 {item['payload_sha256']}")
          if data.get("errors"):
              print("Errors:")
              for error in data["errors"]:
                  print(f"- {error}")
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: scienceverse-rds-structure
          path: scienceverse-rds-inspection/
          if-no-files-found: warn
          retention-days: 30
