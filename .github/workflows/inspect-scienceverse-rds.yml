name: Inspect ScienceVerse RDS structure
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/inspect_scienceverse_rds.R"
      - ".github/workflows/inspect-scienceverse-rds.yml"
      - "data/datasets/candidates/scienceverse-fulltext/**"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
      - name: Install inspection dependency
        run: Rscript -e 'install.packages("jsonlite", repos="https://cloud.r-project.org")'
      - name: Inspect all four full-text objects
        run: Rscript scripts/inspect_scienceverse_rds.R
      - uses: actions/upload-artifact@v4
        with:
          name: scienceverse-rds-structure
          path: scienceverse-rds-inspection/
          if-no-files-found: error
          retention-days: 30
