name: Inspect ScienceVerse RDS structure

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/inspect_scienceverse_rds.R"
      - ".github/workflows/inspect-scienceverse-rds.yml"
      - "data/datasets/candidates/scienceverse-fulltext/**"
      - "data/datasets/candidates/scienceverse-crossref-verified/**"

permissions:
  contents: read

concurrency:
  group: ronin-scienceverse-rds-inspection
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Install R runtime and system jsonlite package
        run: |
          sudo apt-get update
          sudo apt-get install -y r-base r-cran-jsonlite
          Rscript -e 'stopifnot(requireNamespace("jsonlite", quietly=TRUE))'
      - name: Inspect legacy ScienceVerse payloads
        run: |
          Rscript scripts/inspect_scienceverse_rds.R \
            data/datasets/candidates/scienceverse-fulltext \
            scienceverse-rds-inspection/legacy
      - name: Inspect Crossref-verified eLife and Frontiers payloads
        run: |
          Rscript scripts/inspect_scienceverse_rds.R \
            data/datasets/candidates/scienceverse-crossref-verified \
            scienceverse-rds-inspection/crossref
      - name: Summarize verified RDS structures
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          reports = sorted(Path("scienceverse-rds-inspection").rglob("structure-report.json"))
          if not reports:
              print("No structure report was produced.")
              raise SystemExit(0)
          failed = False
          for report in reports:
              data = json.loads(report.read_text(encoding="utf-8"))
              print(f"{report}: {data['status']}")
              for name, item in data.get("datasets", {}).items():
                  print(f"- {name}: {item['eligible_rows']} eligible DOI rows; {item['payload_bytes']} bytes; SHA-256 {item['payload_sha256']}")
                  item_errors = item.get("validation_errors", [])
                  if isinstance(item_errors, str):
                      item_errors = [item_errors]
                  for error in item_errors:
                      print(f"  ERROR: {error}")
              report_errors = data.get("errors", [])
              if isinstance(report_errors, str):
                  report_errors = [report_errors]
              for error in report_errors:
                  print(f"ERROR: {error}")
              failed = failed or data.get("status") != "PASS_STRUCTURE_AND_PROVENANCE_HASHES"
          if failed:
              raise SystemExit("At least one ScienceVerse RDS inspection failed.")
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: scienceverse-rds-structure
          path: scienceverse-rds-inspection/
          if-no-files-found: warn
          retention-days: 30
