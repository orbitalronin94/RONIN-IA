name: Integración continua

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/RUNS.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Análisis estático y comprobación del paquete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar el paquete y las herramientas
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          python -m pip install -e ".[dev]" --no-deps
          python -m pip install "numpy>=1.26" "PyYAML>=6.0" "tqdm>=4.66" "pytest>=8.0" "pytest-cov>=5.0" "ruff>=0.5"
      - name: Ejecutar Ruff
        run: ruff check ronin tests scripts
      - name: Verificar metadatos del paquete
        run: python -m pip check
      - name: Enlazar libro de runs
        if: always()
        uses: ./.github/actions/run-ledger-link

  tests:
    name: Pruebas unitarias y de integración
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar el paquete y las herramientas
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          python -m pip install -e ".[dev]" --no-deps
          python -m pip install "numpy>=1.26" "PyYAML>=6.0" "tqdm>=4.66" "pytest>=8.0" "pytest-cov>=5.0" "ruff>=0.5"
      - name: Validar el gate de licencias sin descargar corpus
        run: python scripts/validate_license_audit.py
      - name: Validar catálogo histórico sin admitirlo a entrenamiento
        run: python scripts/validate_historical_candidates.py
      - name: Probar clasificación de licencias por DOI de ScienceVerse
        run: pytest -q tests/test_scienceverse_collabra_rights.py tests/test_scienceverse_collabra_candidate.py
      - name: Ejecutar la suite de pruebas
        run: pytest --cov=ronin --cov-report=term-missing
      - name: Enlazar libro de runs
        if: always()
        uses: ./.github/actions/run-ledger-link

  tiny-smoke:
    name: Prueba mínima de entrenamiento desde cero
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar el paquete
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          python -m pip install -e . --no-deps
          python -m pip install "numpy>=1.26" "PyYAML>=6.0" "tqdm>=4.66"
      - name: Registrar recursos reales del runner
        run: |
          echo "=== CPU ==="
          nproc
          lscpu
          echo "=== MEMORIA ==="
          free -h
          echo "=== DISCO ==="
          df -h /
          echo "=== PYTHON Y PYTORCH ==="
          python - <<'PY'
          import os
          import platform
          import torch

          print("Sistema:", platform.platform())
          print("Python:", platform.python_version())
          print("CPU visibles:", os.cpu_count())
          print("PyTorch:", torch.__version__)
          print("CUDA disponible:", torch.cuda.is_available())
          print("Dispositivos CUDA:", torch.cuda.device_count())
          PY
      - name: Crear un corpus sintético temporal para la prueba
        run: |
          python - <<'PY'
          from pathlib import Path
          sample = ("RONIN aprende desde una inicialización aleatoria. " * 80)
          Path("/tmp/ronin-smoke.txt").write_text(sample, encoding="utf-8")
          PY
      - name: Entrenar un paso en CPU con el perfil tiny
        run: |
          python scripts/train_text.py \
            --text /tmp/ronin-smoke.txt \
            --profile tiny \
            --steps 1 \
            --device cpu \
            --checkpoints /tmp/ronin-smoke-checkpoints
      - name: Comprobar que existe el checkpoint final
        run: test -s /tmp/ronin-smoke-checkpoints/step-00000001.pt
      - name: Enlazar libro de runs
        if: always()
        uses: ./.github/actions/run-ledger-link

  collabra-rights-preflight:
    name: Preflight de licencias ScienceVerse Collabra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Verificar licencia por DOI y manifiesto fijado
        run: python scripts/preflight_scienceverse_collabra_rights.py
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Descargar RDS fijado y verificar SHA-256
        run: |
          curl --fail --location --retry 3 \
            https://github.com/scienceverse/papers/releases/download/collabra-2026-06-19/collabra.rds \
            --output /tmp/collabra.rds
          echo "377a8686404db8cd3b4d26b690bef77780ed0ef7428b57def55f02a4ce2e6ee5  /tmp/collabra.rds" | sha256sum --check
      - name: Extraer solo texto corporal de los 748 artículos CC BY 4.0
        run: Rscript scripts/extract_scienceverse_collabra.R /tmp/collabra.rds artifacts/scienceverse-collabra/eligible-dois.txt artifacts/scienceverse-collabra/extracted.csv
      - name: Construir candidate JSONL con split por DOI y filtros
        run: python scripts/build_scienceverse_collabra_candidate.py
      - uses: actions/upload-artifact@v6
        with:
          name: ronin-scienceverse-collabra-quality-candidate
          path: artifacts/scienceverse-collabra/
          if-no-files-found: error
          retention-days: 90
