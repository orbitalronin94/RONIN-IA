name: Integración continua RONIN

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-tests:
    name: Calidad del núcleo de modelo
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github
            LICENSE
            README.md
            pyproject.toml
            weights
            benchmarks
            configs
            ronin
            scripts
            tests
            data/datasets/reviews/covost2-manual-review-2026-11-05.json
            data/datasets/rights_registry/records.jsonl
            data/datasets/rights_registry/policy.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar PyTorch CPU y dependencias mínimas
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          python -m pip install -e ".[dev]" --no-deps
          python -m pip install "numpy>=1.26" "PyYAML>=6.0" "tqdm>=4.66" "pytest>=8.0" "pytest-cov>=5.0" "ruff>=0.5"
      - name: Comprobar estilo
        run: ruff check ronin tests scripts
      - name: Comprobar instalación
        run: python -m pip check
      - name: Verificar pesos del modelo main
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import torch
          from ronin.config import get_profile
          from ronin.models.transformer import RoninLM
          manifest = json.loads(Path("weights/main-model.json").read_text(encoding="utf-8"))
          checkpoint = Path(manifest["weights_path"])
          digest = hashlib.sha256(checkpoint.read_bytes()).hexdigest()
          assert digest == manifest["weights_sha256"]
          payload = torch.load(checkpoint, map_location="cpu", weights_only=False)
          model = RoninLM(get_profile("tiny")[0])
          model.load_state_dict(payload["model"], strict=True)
          assert payload["step"] == manifest["checkpoint_step"]
          assert sum(parameter.numel() for parameter in model.parameters()) == manifest["parameters"]
          print("Pesos main íntegros:", manifest["model_name"], digest)
          PY
      - name: Ejecutar pruebas unitarias
        run: pytest --cov=ronin --cov-report=term-missing

  tiny-smoke:
    name: Smoke test de entrenamiento desde cero
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias mínimas
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          python -m pip install -e . --no-deps
          python -m pip install "numpy>=1.26" "PyYAML>=6.0" "tqdm>=4.66"
      - name: Crear corpus temporal
        run: |
          python - <<'PY'
          from pathlib import Path
          Path("/tmp/ronin-smoke.txt").write_text(
              "RONIN aprende desde una inicialización aleatoria. " * 80,
              encoding="utf-8",
          )
          PY
      - name: Entrenar un paso
        run: |
          python scripts/train_text.py --text /tmp/ronin-smoke.txt --profile tiny --steps 1 --device cpu --checkpoints /tmp/ronin-smoke
      - name: Verificar checkpoint
        run: test -s /tmp/ronin-smoke/step-00000001.pt
