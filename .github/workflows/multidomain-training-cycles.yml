name: Ciclos de entrenamiento y evaluación multidominio

on:
  workflow_dispatch:
    inputs:
      steps:
        description: Pasos por ciclo (1-1000)
        required: true
        default: "1000"
        type: string
      seeds:
        description: Semillas separadas por comas
        required: true
        default: "1337,2027,42"
        type: string

permissions:
  contents: read

concurrency:
  group: ronin-multidomain-training
  cancel-in-progress: false

jobs:
  ciclos:
    name: Entrenar y evaluar cada semilla
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Obtener RONIN IA
        uses: actions/checkout@v4

      - name: "Gate G-0: bloquear si no hay derechos acreditados"
        run: python scripts/assert_g0_passed.py

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          python -m pip install -e . --no-deps
          python -m pip install "numpy>=1.26" "PyYAML>=6.0" "tqdm>=4.66"

      - name: Validar experimento
        env:
          STEPS: ${{ inputs.steps }}
          SEEDS: ${{ inputs.seeds }}
        run: |
          if ! [[ "$STEPS" =~ ^[0-9]+$ ]] || [ "$STEPS" -lt 1 ] || [ "$STEPS" -gt 1000 ]; then
            echo "::error::Los pasos deben estar entre 1 y 1000."
            exit 1
          fi
          if ! [[ "$SEEDS" =~ ^[0-9]+(,[0-9]+)*$ ]]; then
            echo "::error::Semillas inválidas."
            exit 1
          fi
          IFS=',' read -ra values <<< "$SEEDS"
          if [ "${#values[@]}" -gt 5 ]; then
            echo "::error::Máximo cinco semillas por ejecución."
            exit 1
          fi
          declare -A seen
          for seed in "${values[@]}"; do
            if [ -n "${seen[$seed]+x}" ]; then
              echo "::error::Semilla duplicada: $seed"
              exit 1
            fi
            seen[$seed]=1
          done
          mkdir -p reports checkpoints

      - name: Preparar corpus público con manifiesto
        run: |
          python scripts/prepare_open_corpora.py \
            --output /tmp/ronin-multidomain/processed \
            --cache-dir /tmp/ronin-multidomain/cache

      - name: Ejecutar ciclos independientes con medición inicial y final
        env:
          STEPS: ${{ inputs.steps }}
          SEEDS: ${{ inputs.seeds }}
        run: |
          IFS=',' read -ra seed_values <<< "$SEEDS"
          for seed in "${seed_values[@]}"; do
            echo "::group::Semilla $seed"
            checkpoint_dir="checkpoints/seed-$seed"
            report_dir="reports/seed-$seed"
            initial_checkpoint="/tmp/ronin-multidomain/inicial-seed-$seed.pt"
            mkdir -p "$checkpoint_dir" "$report_dir"

            # La referencia usa exactamente la semilla y la inicialización
            # que empleará train_text.py para este ciclo.
            SEED="$seed" INITIAL_CHECKPOINT="$initial_checkpoint" python - <<'PY'
          import os
          import torch
          from ronin.config import get_profile
          from ronin.models.transformer import RoninLM
          from ronin.utils.repro import seed_everything

          config, _ = get_profile("tiny")
          seed = int(os.environ["SEED"])
          seed_everything(seed)
          model = RoninLM(config)
          torch.save({"model": model.state_dict(), "step": 0}, os.environ["INITIAL_CHECKPOINT"])
          print(f"Referencia inicial: semilla={seed}, parámetros={model.parameter_count}")
          PY

            python scripts/evaluate_text.py \
              --checkpoint "$initial_checkpoint" \
              --validation-text /tmp/ronin-multidomain/processed/validation.txt \
              --profile tiny --batches 128 --batch-size 2 --seed 2026 \
              --device cpu --output "$report_dir/language-model-inicial.json"

            python scripts/evaluate_domains.py \
              --checkpoint "$initial_checkpoint" \
              --dataset benchmarks/domains_v1.jsonl \
              --profile tiny --device cpu \
              --output "$report_dir/domains-inicial.json"

            python scripts/train_text.py \
              --text /tmp/ronin-multidomain/processed/train.txt \
              --profile tiny --steps "$STEPS" --seed "$seed" \
              --device cpu --checkpoints "$checkpoint_dir"

            checkpoint="$checkpoint_dir/step-$(printf '%08d' "$STEPS").pt"
            test -s "$checkpoint"

            python scripts/evaluate_text.py \
              --checkpoint "$checkpoint" \
              --validation-text /tmp/ronin-multidomain/processed/validation.txt \
              --profile tiny --batches 128 --batch-size 2 --seed 2026 \
              --device cpu --output "$report_dir/language-model.json"

            python scripts/evaluate_domains.py \
              --checkpoint "$checkpoint" \
              --dataset benchmarks/domains_v1.jsonl \
              --profile tiny --device cpu \
              --output "$report_dir/domains-v1.json"

            echo "::endgroup::"
          done

      - name: Consolidar resultados y hashes
        env:
          STEPS: ${{ inputs.steps }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def sha(path):
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          root = Path("reports")
          rows = []
          for domain_report in sorted(root.glob("seed-*/domains-v1.json")):
              seed_dir = domain_report.parent
              language_initial = json.loads((seed_dir / "language-model-inicial.json").read_text())
              language_final = json.loads((seed_dir / "language-model.json").read_text())
              domains_initial = json.loads((seed_dir / "domains-inicial.json").read_text())
              domains_final = json.loads(domain_report.read_text())
              rows.append({
                  "seed": seed_dir.name.removeprefix("seed-"),
                  "initial": {
                      "language_model": language_initial,
                      "domains": domains_initial,
                  },
                  "final": {
                      "language_model": language_final,
                      "domains": domains_final,
                  },
                  "delta": {
                      "bits_per_byte": (
                          language_final["bits_per_byte"] - language_initial["bits_per_byte"]
                      ),
                      "domain_accuracy": (
                          domains_final["overall"]["accuracy"]
                          - domains_initial["overall"]["accuracy"]
                      ),
                  },
              })

          dataset = Path("benchmarks/domains_v1.jsonl")
          manifest_path = Path("/tmp/ronin-multidomain/processed/manifest.json")
          manifest = json.loads(manifest_path.read_text())
          result = {
              "experiment": "ronin-multidomain-independent-seeds-v2",
              "steps_per_cycle": int(os.environ.get("STEPS", "1000")),
              "seeds": [row["seed"] for row in rows],
              "dataset_sha256": sha(dataset),
              "corpus_manifest": manifest,
              "cycles": rows,
              "interpretation": [
                  "Cada semilla constituye un entrenamiento independiente desde inicialización aleatoria.",
                  "La referencia inicial y el entrenamiento comparten exactamente la misma semilla.",
                  "La exactitud multidominio usa un piloto pequeño de 23 preguntas y elección del siguiente byte; no mide razonamiento abierto.",
                  "BPB mide modelado del corpus de validación, no competencia por dominio.",
                  "No se ha evaluado ni usado el holdout reservado.",
                  "Un delta positivo de BPB indica empeoramiento; un delta positivo de exactitud indica mejora.",
              ],
          }
          Path("reports/resumen-multidominio.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + chr(10),
              encoding="utf-8",
          )
          print(json.dumps({
              "cycles": len(rows),
              "seeds": result["seeds"],
              "delta_domain_accuracy": {
                  row["seed"]: row["delta"]["domain_accuracy"] for row in rows
              },
              "delta_bits_per_byte": {
                  row["seed"]: row["delta"]["bits_per_byte"] for row in rows
              },
          }, ensure_ascii=False, indent=2))
          PY

      - name: Publicar solo informes (nunca checkpoints)
        uses: actions/upload-artifact@v4
        with:
          name: ronin-ciclos-multidominio
          path: reports/
          if-no-files-found: error
          retention-days: 30
