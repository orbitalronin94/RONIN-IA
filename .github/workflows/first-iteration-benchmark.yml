name: Primera iteración y benchmark interno

on:
  workflow_dispatch:
    inputs:
      steps:
        description: Pasos de entrenamiento (entre 1 y 1000)
        required: true
        default: "1000"
        type: string
      benchmark_holdout:
        description: Evaluar también el test reservado (solo para una medición de referencia)
        required: true
        default: false
        type: boolean
permissions:
  contents: read

concurrency:
  group: ronin-first-iteration
  cancel-in-progress: false

jobs:
  entrenar-y-evaluar:
    name: Entrenar tiny desde cero y medir literatura de dominio público
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Obtener RONIN IA
        uses: actions/checkout@v4

      - name: "Gate G-0: bloquear si no hay derechos acreditados"
        id: g0
        run: python scripts/assert_g0_passed.py --github-output "$GITHUB_OUTPUT"

      - name: Preparar Python
        if: steps.g0.outputs.authorized == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar PyTorch CPU y dependencias
        if: steps.g0.outputs.authorized == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          python -m pip install -e . --no-deps
          python -m pip install "numpy>=1.26" "PyYAML>=6.0" "tqdm>=4.66"

      - name: Descargar y preparar corpus público sin credenciales
        if: steps.g0.outputs.authorized == 'true'
        run: |
          python scripts/prepare_open_corpora.py \
            --output /tmp/ronin-open-corpus/processed \
            --cache-dir /tmp/ronin-open-corpus/cache

      - name: Validar presupuesto de entrenamiento
        if: steps.g0.outputs.authorized == 'true'
        env:
          STEPS: ${{ inputs.steps || (github.event_name == 'pull_request' && '100' || '1000') }}
        run: |
          if ! [[ "$STEPS" =~ ^[0-9]+$ ]] || [ "$STEPS" -lt 1 ] || [ "$STEPS" -gt 1000 ]; then
            echo "::error::Los pasos deben estar entre 1 y 1000."
            exit 1
          fi

      - name: Guardar referencia de inicialización aleatoria
        if: steps.g0.outputs.authorized == 'true'
        run: |
          mkdir -p /tmp/ronin-first/reports
          python - <<'PY'
          import torch
          from ronin.config import get_profile
          from ronin.models.transformer import RoninLM
          from ronin.utils.repro import seed_everything

          model_config, training_config = get_profile("tiny")
          seed_everything(training_config.seed)
          model = RoninLM(model_config)
          torch.save({"model": model.state_dict(), "step": 0}, "/tmp/ronin-first/inicial.pt")
          print("Parámetros:", model.parameter_count)
          print("Semilla de inicialización:", training_config.seed)
          PY

      - name: Medir referencia inicial en validación
        if: steps.g0.outputs.authorized == 'true'
        run: |
          python scripts/evaluate_text.py \
            --checkpoint /tmp/ronin-first/inicial.pt \
            --validation-text /tmp/ronin-open-corpus/processed/validation.txt \
            --profile tiny --batches 128 --batch-size 2 --seed 2026 --device cpu \
            --output /tmp/ronin-first/reports/inicial-validation.json

      - name: Medir referencia inicial en holdout reservado
        if: steps.g0.outputs.authorized == 'true' && (inputs.benchmark_holdout)
        run: |
          python scripts/evaluate_text.py \
            --checkpoint /tmp/ronin-first/inicial.pt \
            --validation-text /tmp/ronin-open-corpus/processed/test.txt \
            --profile tiny --batches 128 --batch-size 2 --seed 2026 --device cpu \
            --output /tmp/ronin-first/reports/inicial-test.json

      - name: Entrenar RONIN desde cero
        if: steps.g0.outputs.authorized == 'true'
        env:
          STEPS: ${{ inputs.steps || (github.event_name == 'pull_request' && '100' || '1000') }}
        run: |
          inicio=$(date +%s)
          python scripts/train_text.py \
            --text /tmp/ronin-open-corpus/processed/train.txt \
            --profile tiny \
            --steps "$STEPS" \
            --device cpu \
            --checkpoints /tmp/ronin-first/checkpoints
          fin=$(date +%s)
          echo "$((fin - inicio))" > /tmp/ronin-first/reports/tiempo_entrenamiento_segundos.txt

      - name: Evaluar modelo entrenado en validación
        if: steps.g0.outputs.authorized == 'true'
        env:
          STEPS: ${{ inputs.steps || (github.event_name == 'pull_request' && '100' || '1000') }}
        run: |
          checkpoint="/tmp/ronin-first/checkpoints/step-$(printf '%08d' "$STEPS").pt"
          test -s "$checkpoint"
          python scripts/evaluate_text.py \
            --checkpoint "$checkpoint" \
            --validation-text /tmp/ronin-open-corpus/processed/validation.txt \
            --profile tiny --batches 128 --batch-size 2 --seed 2026 --device cpu \
            --output /tmp/ronin-first/reports/entrenado-validation.json

      - name: Evaluar una sola vez el holdout reservado
        if: steps.g0.outputs.authorized == 'true' && (inputs.benchmark_holdout)
        env:
          STEPS: ${{ inputs.steps || (github.event_name == 'pull_request' && '100' || '1000') }}
        run: |
          checkpoint="/tmp/ronin-first/checkpoints/step-$(printf '%08d' "$STEPS").pt"
          python scripts/evaluate_text.py \
            --checkpoint "$checkpoint" \
            --validation-text /tmp/ronin-open-corpus/processed/test.txt \
            --profile tiny --batches 128 --batch-size 2 --seed 2026 --device cpu \
            --output /tmp/ronin-first/reports/entrenado-test.json

      - name: Evaluar batería multidominio antes y después del entrenamiento
        if: steps.g0.outputs.authorized == 'true'
        env:
          STEPS: ${{ inputs.steps || (github.event_name == 'pull_request' && '100' || '1000') }}
        run: |
          checkpoint="/tmp/ronin-first/checkpoints/step-$(printf '%08d' "$STEPS").pt"
          python scripts/evaluate_domains.py \
            --checkpoint /tmp/ronin-first/inicial.pt \
            --dataset benchmarks/domains_v1.jsonl \
            --profile tiny --device cpu \
            --output /tmp/ronin-first/reports/domains-inicial.json
          python scripts/evaluate_domains.py \
            --checkpoint "$checkpoint" \
            --dataset benchmarks/domains_v1.jsonl \
            --profile tiny --device cpu \
            --output /tmp/ronin-first/reports/domains-entrenado.json

      - name: Comparar arquitectura histórica y actual (A/B)
        if: steps.g0.outputs.authorized == 'true'
        env:
          STEPS: ${{ inputs.steps || (github.event_name == 'pull_request' && '100' || '1000') }}
        run: |
          python scripts/benchmark_architecture_ab.py \
            --train-text /tmp/ronin-open-corpus/processed/train.txt \
            --validation-text /tmp/ronin-open-corpus/processed/validation.txt \
            --steps "$STEPS" \
            --seeds "1337,2027,42" \
            --eval-batches 128 \
            --batch-size 2 \
            --output /tmp/ronin-first/reports/architecture-ab.json

      - name: Construir informe reproducible
        if: steps.g0.outputs.authorized == 'true'
        env:
          STEPS: ${{ inputs.steps || (github.event_name == 'pull_request' && '100' || '1000') }}
          BENCHMARK_HOLDOUT: ${{ inputs.benchmark_holdout || false }}
        run: |
          python - <<'PY'
          import json
          import os
          import platform
          from dataclasses import replace
          from pathlib import Path

          import torch
          from ronin.config import get_profile

          root = Path("/tmp/ronin-open-corpus/processed")
          reports = Path("/tmp/ronin-first/reports")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          model_config, training_config = get_profile("tiny")
          steps = int(os.environ["STEPS"])
          benchmark_holdout = os.environ["BENCHMARK_HOLDOUT"].lower() == "true"
          training_config = replace(
              training_config,
              max_steps=steps,
              warmup_steps=min(training_config.warmup_steps, max(1, steps // 10)),
          )

          splits = ["validation"]
          if benchmark_holdout:
              splits.append("test")
          metrics = {}
          for split in splits:
              initial = json.loads((reports / f"inicial-{split}.json").read_text())
              trained = json.loads((reports / f"entrenado-{split}.json").read_text())
              before = initial["bits_per_byte"]
              after = trained["bits_per_byte"]
              metrics[split] = {
                  "inicial": initial,
                  "entrenado": trained,
                  "delta_bits_per_byte": after - before,
                  "reduccion_porcentual_bits_per_byte": (
                      100.0 * (before - after) / before if before else None
                  ),
              }

          summary = {
              "proyecto": "RONIN IA",
              "tipo": (
                  "medición de referencia con holdout reservado"
                  if benchmark_holdout
                  else "experimento de entrenamiento; solo validación"
              ),
              "holdout_evaluado": benchmark_holdout,
              "dataset": {
                  "id": manifest["dataset_id"],
                  "licencia": manifest["license"],
                  "acceso": manifest["access"],
                  "fuentes": manifest["sources"],
                  "documentos_aceptados": manifest["document_count"],
                  "documentos_por_particion": manifest["document_counts"],
                  "documentos_por_fuente": manifest["source_document_counts"],
                  "elementos_excluidos": manifest["skipped_count"],
                  "sha256_particiones": manifest["output_sha256"],
              },
              "modelo": {
                  "perfil": "tiny",
                  "inicializacion": "aleatoria; no se importan pesos de tutores",
                  "configuracion": model_config.__dict__,
                  "parametros": metrics["validation"]["entrenado"]["parameter_count"],
                  "configuracion_entrenamiento": training_config.__dict__,
                  "pasos_ejecutados": steps,
                  "tokens_presentados_aproximados": (
                      steps * training_config.batch_size
                      * training_config.gradient_accumulation_steps
                      * model_config.context_length
                  ),
                  "tiempo_entrenamiento_segundos": int(
                      (reports / "tiempo_entrenamiento_segundos.txt").read_text()
                  ),
              },
              "entorno": {
                  "python": platform.python_version(),
                  "pytorch": torch.__version__,
                  "sistema": platform.platform(),
                  "cpu_logicos": os.cpu_count(),
                  "dispositivo": "cpu",
                  "cuda_disponible": torch.cuda.is_available(),
              },
              "evaluacion": {
                  "tokenizador": "byte-v1",
                  "semilla_muestreo": 2026,
                  "lotes_por_particion": 128,
                  "tamano_lote": 2,
                  "tokens_evaluados_por_particion": (
                      128 * 2 * model_config.context_length
                  ),
                  "metricas": metrics,
              },
              "limitaciones": [
                  "El conjunto inicial está formado por literatura histórica; no representa por sí solo el español contemporáneo ni todas sus variedades.",
                  "Las métricas son comparables solo manteniendo idénticos corpus, tokenizador, perfil y protocolo.",
                  "La partición test nunca se usa para gradientes ni ajuste de hiperparámetros; solo se evalúa si se solicita explícitamente una medición de referencia.",
                  "La perplejidad byte-level no equivale a calidad conversacional ni a razonamiento.",
              ],
          }
          (reports / "resumen.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({
              "resumen": str(reports / "resumen.json"),
              "holdout_evaluado": benchmark_holdout,
              "metricas": {
                  key: {
                      "bpb_inicial": value["inicial"]["bits_per_byte"],
                      "bpb_entrenado": value["entrenado"]["bits_per_byte"],
                  }
                  for key, value in metrics.items()
              },
          }, ensure_ascii=False, indent=2))
          PY

      - name: Publicar solo métricas y manifiesto resumido
        if: steps.g0.outputs.authorized == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ronin-primera-iteracion-metricas
          path: /tmp/ronin-first/reports/
          if-no-files-found: error
          retention-days: 30
