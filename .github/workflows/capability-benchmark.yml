name: Ronin capability benchmark

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'scripts/benchmark_capabilities.py'
      - '.github/workflows/capability-benchmark.yml'

permissions:
  contents: read

concurrency:
  group: ronin-capability-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU inference dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch transformers safetensors accelerate
      - name: Run fixed capability suite
        id: benchmark
        continue-on-error: true
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: python scripts/benchmark_capabilities.py
      - name: Upload results including model responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ronin-capability-benchmark
          path: capability-benchmark-report.json
          if-no-files-found: warn
          retention-days: 30
      - name: Fail if no model produced results
        if: steps.benchmark.outcome == 'failure'
        run: |
          echo "::error::Capability benchmark failed; inspect logs."
          exit 1
