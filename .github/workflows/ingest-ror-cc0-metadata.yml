name: Ingest ROR CC0 metadata candidate

on:
  push:
    branches: [main]
    paths:
      - "scripts/ingest_ror_cc0_metadata.py"
      - ".github/workflows/ingest-ror-cc0-metadata.yml"
  workflow_dispatch:
    inputs:
      max_rows:
        description: Maximum ROR records
        required: false
        default: "1000000"
  schedule:
    - cron: "13 5 9 * *"

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build bounded ROR metadata candidate
        run: python scripts/ingest_ror_cc0_metadata.py --max-rows "1000000"
      - name: Validate proposed rights record
        run: python scripts/validate_rights_registry.py --record artifacts/ror/rights-record.candidate.json
      - uses: actions/upload-artifact@v6
        with:
          name: ronin-ror-cc0-metadata-candidate
          path: artifacts/ror/
          if-no-files-found: error
          retention-days: 90
