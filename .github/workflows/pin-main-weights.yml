name: RONIN — fijar pesos del modelo main

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pin-main-weights.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  extract-and-pin:
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github
            weights
            configs
            ronin
      - name: Descargar artefacto del candidato seed 202
        uses: actions/download-artifact@v8
        with:
          name: ronin-corpus-seed-202-500steps-42071401130
          path: incoming/seed-202
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: "42071401130"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar PyTorch para validar el checkpoint
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          python -m pip install "numpy>=1.26"
      - name: Extraer, validar y empaquetar únicamente los pesos principales
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import torch
          from ronin.config import get_profile
          from ronin.models.transformer import RoninLM

          expected = "86d7d97360f1eb0ac35e9dc12f69c366101629641115ba1c2a1341b2b7d257ae"
          matches = list(Path("incoming/seed-202").rglob("step-00000500.pt"))
          if len(matches) != 1:
              raise SystemExit(f"Se esperaba un checkpoint seed-202; encontrados: {len(matches)}")
          source = matches[0]
          digest = hashlib.sha256(source.read_bytes()).hexdigest()
          if digest != expected:
              raise SystemExit(f"SHA-256 inesperado: {digest}")
          payload = torch.load(source, map_location="cpu", weights_only=False)
          if payload.get("step") != 500 or not isinstance(payload.get("model"), dict):
              raise SystemExit("El checkpoint no corresponde al ciclo seed-202 de 500 pasos")

          model_config, _ = get_profile("tiny")
          model = RoninLM(model_config)
          model.load_state_dict(payload["model"], strict=True)
          if model.parameter_count != 9922880:
              raise SystemExit(f"Recuento de parámetros inesperado: {model.parameter_count}")

          target = Path("weights/ronin-main.pt")
          target.parent.mkdir(parents=True, exist_ok=True)
          torch.save({
              "model": model.state_dict(),
              "step": 500,
              "profile": "tiny",
              "training_config": payload.get("training_config"),
              "weights_only": True,
          }, target)
          if target.stat().st_size >= 90_000_000:
              raise SystemExit(f"Los pesos no caben como archivo Git normal: {target.stat().st_size} bytes")
          weights_digest = hashlib.sha256(target.read_bytes()).hexdigest()

          manifest_path = Path("weights/main-model.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("checkpoint_sha256") != expected:
              raise SystemExit("El manifiesto no apunta al checkpoint esperado")
          manifest["weights_path"] = "weights/ronin-main.pt"
          manifest["weights_sha256"] = weights_digest
          manifest["weights_bytes"] = target.stat().st_size
          manifest["checkpoint_storage"] = "versioned compact model state; optimizer state intentionally excluded"
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"checkpoint_sha256={digest} weights_sha256={weights_digest} weights_bytes={target.stat().st_size}")
          PY
      - name: Incorporar los pesos verificados a main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weights/ronin-main.pt weights/main-model.json
          if git diff --cached --quiet; then
            echo "Los pesos y el manifiesto ya están actualizados en main."
          else
            git commit -m "model: promote verified seed-202 weights to main"
            git push origin main
          fi
      - name: Publicar copia de recuperación de los pesos
        uses: actions/upload-artifact@v7
        with:
          name: ronin-main-seed202-weights
          path: weights/ronin-main.pt
          if-no-files-found: error
          retention-days: 90
