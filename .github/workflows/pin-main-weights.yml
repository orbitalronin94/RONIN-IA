name: RONIN — fijar pesos del modelo main

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pin-main-weights.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  extract-and-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - name: Descargar artefacto histórico del modelo main
        uses: actions/download-artifact@v6
        with:
          name: ronin-main-cycle2-mmlu-pro-full
          path: incoming/main
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: "42017319862"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Instalar PyTorch para validar el checkpoint
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
      - name: Extraer y verificar únicamente los pesos principales
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, shutil
          from pathlib import Path
          expected = "a90a01a3e7f53e2e4aec1f0c1f0c137eedfe219f3fc3cc65f5eea827829d6f25"
          root = Path("incoming/main")
          matches = list(root.rglob("main.pt"))
          if len(matches) != 1:
              raise SystemExit(f"Se esperaba un checkpoint main; encontrados: {len(matches)}")
          source = matches[0]
          digest = hashlib.sha256(source.read_bytes()).hexdigest()
          if digest != expected:
              raise SystemExit(f"SHA-256 inesperado: {digest}")
          import torch
          payload = torch.load(source, map_location="cpu", weights_only=False)
          if payload.get("step") != 1000 or not isinstance(payload.get("model"), dict):
              raise SystemExit("El checkpoint no corresponde al modelo main fijado")
          target = Path("/tmp/ronin-main.pt")
          torch.save({
              "model": payload["model"],
              "step": payload["step"],
              "profile": "tiny",
              "training_config": payload.get("training_config"),
              "weights_only": True,
          }, target)
          if target.stat().st_size >= 90_000_000:
              raise SystemExit(f"Los pesos no caben como archivo Git normal: {target.stat().st_size} bytes")
          weights_digest = hashlib.sha256(target.read_bytes()).hexdigest()
          import json
          manifest_path = Path("weights/main-model.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["weights_path"] = "weights/ronin-main.pt"
          manifest["weights_sha256"] = weights_digest
          manifest["weights_bytes"] = target.stat().st_size
          manifest["checkpoint_storage"] = "versioned model state_dict; optimizer state intentionally excluded"
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"checkpoint_sha256={digest} weights_sha256={weights_digest} weights_bytes={target.stat().st_size}")
          PY
      - name: Incorporar los pesos verificados a main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/ronin-main.pt weights/ronin-main.pt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weights/ronin-main.pt weights/main-model.json
          git commit -m "model: versionar los pesos verificados de RONIN main"
          git push origin main
      - name: Publicar copia de recuperación del checkpoint
        uses: actions/upload-artifact@v6
        with:
          name: ronin-main-weights-v1
          path: weights/ronin-main.pt
          if-no-files-found: error
          retention-days: 90
