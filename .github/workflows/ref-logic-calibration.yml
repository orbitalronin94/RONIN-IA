name: Calibración REF — lógica y falacias

on:
  pull_request:
    branches: [main]
    paths:
      - "data/fixtures/ref_logic_calibration.jsonl"
      - "docs/LOGICA_FALACIAS_REFERENCIA_REF.md"
      - "scripts/validate_ref_logic_fixtures.py"
      - "ronin/epistemic/schema.py"
      - "tests/test_ref_logic_fixtures.py"
      - ".github/workflows/ref-logic-calibration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias mínimas
        run: python -m pip install -e . --no-deps
      - name: Validar fixtures contra el esquema REF
        run: python scripts/validate_ref_logic_fixtures.py
      - name: Ejecutar pruebas específicas
        run: python -m pytest -q tests/test_ref_logic_fixtures.py
