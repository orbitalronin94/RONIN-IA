name: Ingest OpenCitations CC0 citation graph candidate

on:
  push:
    branches: [main]
    paths:
      - "scripts/ingest_opencitations_index.py"
      - ".github/workflows/ingest-opencitations-index.yml"
  workflow_dispatch:
    inputs:
      max_dois:
        description: Maximum DOI requests (1-30)
        required: false
        default: "20"
      query:
        description: Crossref seed query
        required: false
        default: "open science"
  schedule:
    - cron: "29 6 15 * *"

permissions:
  contents: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Harvest bounded public CC0 citation graph without tokens
        run: python scripts/ingest_opencitations_index.py --max-dois "${{ inputs.max_dois || '20' }}" --query "${{ inputs.query || 'open science' }}"
      - name: Validate exact-scope rights candidate
        run: python scripts/validate_rights_registry.py --record artifacts/opencitations/rights-record.candidate.json
      - uses: actions/upload-artifact@v6
        with:
          name: ronin-opencitations-index-cc0-candidate
          path: artifacts/opencitations/
          if-no-files-found: error
          retention-days: 90
