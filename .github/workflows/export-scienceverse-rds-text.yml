name: Export ScienceVerse RDS into per-document JSONL
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-scienceverse-rds-text.yml"
      - "scripts/export_scienceverse_rds_text.R"
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: ronin-scienceverse-text-export
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Install R, JSON and SHA-256 packages
        run: |
          sudo apt-get update
          sudo apt-get install -y r-base r-cran-jsonlite r-cran-digest
      - name: Export only eligible DOI records to per-document JSONL
        run: Rscript scripts/export_scienceverse_rds_text.R
      - name: Validate export counts and hashes
        run: |
          Rscript -e 'x <- jsonlite::fromJSON("data/datasets/candidates/scienceverse-text-export-v1/summary.json", simplifyVector=FALSE); stopifnot(identical(x$status, "candidate_export_complete")); print(lapply(x$datasets, function(d) d$stats))'
      - name: Commit compressed document payloads and manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/datasets/candidates/scienceverse-text-export-v1
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: export ScienceVerse eligible documents as compressed JSONL"
          for attempt in $(seq 1 24); do
            pending=$(gh run list --workflow run-ledger.yml --limit 30 --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "pending")] | length')
            if [ "$pending" = "0" ]; then
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
            fi
            sleep 5
          done
          echo "Unable to push ScienceVerse text export after run-ledger writes" >&2
          exit 1
