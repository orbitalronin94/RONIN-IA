name: Auditoría de descargas reales del corpus

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/prepare_open_corpora.py"
      - "scripts/acquire_cryptography_library.py"
      - "scripts/acquire_pleias_pd_shards.py"
      - "tests/test_acquire_pleias_pd_shards.py"
      - "docs/FUENTES_CORPUS_ABIERTOS.md"
      - "docs/CASOS_CODIFICACION_DOCUMENTADA.md"
      - ".github/workflows/corpus-acquisition-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corpus-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acquire-and-audit:
    name: Descargar y verificar bibliotecas abiertas
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Descargar archivos originales sin credenciales y preparar corpus
        run: |
          python scripts/prepare_open_corpora.py \
            --output /tmp/ronin-open-corpus/processed \
            --cache-dir /tmp/ronin-open-corpus/cache
      - name: Comprobar manifiesto, fuentes y particiones
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("/tmp/ronin-open-corpus/processed")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          assert manifest["document_count"] >= 100
          assert len(manifest["sources"]) == 3
          assert all(manifest["source_document_counts"][key] > 0 for key in (
              "cligs-textbox", "cligs-conssa", "eltec-spa"
          ))
          assert set(manifest["document_counts"]) == {"train", "validation", "test"}
          rows = [json.loads(line) for line in (root / "documents.jsonl").read_text(encoding="utf-8").splitlines()]
          assert len(rows) == manifest["document_count"]
          assert {row["partition"] for row in rows} == {"train", "validation", "test"}
          assert all(
              row["source_id"]
              and row["source_revision"]
              and row["license_text"]
              and len(row["source_file_sha256"]) == 64
              for row in rows
          )
          assert sum(manifest["document_counts"].values()) == manifest["document_count"]
          assert all(len(value) == 64 for value in manifest["output_sha256"].values())
          for name in ("train.txt", "validation.txt", "test.txt"):
              assert (root / name).is_file() and (root / name).stat().st_size > 0
          print(json.dumps({
              "document_count": manifest["document_count"],
              "source_document_counts": manifest["source_document_counts"],
              "document_counts": manifest["document_counts"],
              "source_downloads": {
                  item["id"]: {
                      "tree_sha": item["tree_sha"],
                      "downloaded_file_count": item["downloaded_file_count"],
                      "downloaded_files_sha256": item["downloaded_files_sha256"],
                  }
                  for item in manifest["sources"]
              },
              "output_sha256": manifest["output_sha256"],
              "skipped_count": manifest["skipped_count"],
          }, ensure_ascii=False, indent=2))
          PY
      - name: Publicar corpus y fuentes primarias como artefactos auditables
        uses: actions/upload-artifact@v4
        with:
          name: ronin-bibliotecas-adquiridas
          path: |
            /tmp/ronin-open-corpus/processed/manifest.json
            /tmp/ronin-open-corpus/processed/documents.jsonl
          if-no-files-found: error
          retention-days: 30

      - name: Publicar particiones de texto preparadas (retención temporal)
        uses: actions/upload-artifact@v4
        with:
          name: ronin-corpus-v2-particiones
          path: |
            /tmp/ronin-open-corpus/processed/train.txt
            /tmp/ronin-open-corpus/processed/validation.txt
            /tmp/ronin-open-corpus/processed/test.txt
          if-no-files-found: error
          retention-days: 7

  acquire-cryptography-library:
    name: Descargar fuentes primarias de criptografía
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Descargar cinco fuentes HTTPS sin credenciales
        run: |
          python scripts/acquire_cryptography_library.py \
            --output-dir /tmp/ronin-cryptography-library
      - name: Verificar originales, hashes y exclusión del entrenamiento
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("/tmp/ronin-cryptography-library")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          assert manifest["credential_free"] is True
          assert manifest["retrieved_at"]
          assert manifest["source_count"] == 5
          for source in manifest["sources"]:
              path = root / source["local_filename"]
              data = path.read_bytes()
              assert len(data) == source["size_bytes"]
              assert hashlib.sha256(data).hexdigest() == source["sha256"]
              assert not source["expected_sha256"] or source["expected_sha256"] == source["sha256"]
              assert source["training_status"] == "excluded_pending_manual_review"
          print(json.dumps({
              "library_id": manifest["library_id"],
              "source_count": manifest["source_count"],
              "sources": [
                  {
                      "id": source["id"],
                      "size_bytes": source["size_bytes"],
                      "sha256": source["sha256"],
                      "format": source["format"],
                      "training_status": source["training_status"],
                  }
                  for source in manifest["sources"]
              ],
          }, ensure_ascii=False, indent=2))
          PY
      - name: Publicar fuentes y manifiesto como biblioteca auxiliar temporal
        uses: actions/upload-artifact@v4
        with:
          name: ronin-cryptography-library-v1
          path: /tmp/ronin-cryptography-library
          if-no-files-found: error
          retention-days: 7

  acquire-pleias-pd:
    name: Descargar fragmentos PleIAs de dominio público
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar lector Parquet fijado
        run: python -m pip install --no-cache-dir pyarrow==21.0.0
      - name: Descargar 4 fragmentos de libros y 1 de prensa sin credenciales
        run: |
          python scripts/acquire_pleias_pd_shards.py \
            --output-dir /tmp/ronin-pleias-pd
      - name: Verificar hashes, filas y columnas de texto
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("/tmp/ronin-pleias-pd")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          assert manifest["credential_free"] is True
          assert manifest["source_count"] == 5
          assert manifest["total_downloaded_bytes"] > 1_000_000_000
          assert manifest["total_parquet_rows"] > 1_000
          assert all(
              source["sha256"] == source["expected_sha256"]
              and source["text_column"] == "text"
              and source["nonempty_text_rows"] > 0
              and source["training_status"] == "acquired_pending_ocr_quality_review"
              for source in manifest["sources"]
          )
          assert sum(source["collection"] == "libros" for source in manifest["sources"]) == 4
          assert sum(source["collection"] == "prensa" for source in manifest["sources"]) == 1
          print(json.dumps({
              "library_id": manifest["library_id"],
              "total_downloaded_bytes": manifest["total_downloaded_bytes"],
              "total_parquet_rows": manifest["total_parquet_rows"],
              "total_nonempty_text_rows": manifest["total_nonempty_text_rows"],
              "sources": [
                  {
                      "id": source["id"],
                      "size_bytes": source["size_bytes"],
                      "rows": source["parquet_rows"],
                      "nonempty_text_rows": source["nonempty_text_rows"],
                      "sha256": source["sha256"],
                  }
                  for source in manifest["sources"]
              ],
          }, ensure_ascii=False, indent=2))
          PY
      - name: Publicar manifiesto de adquisición PleIAs
        uses: actions/upload-artifact@v4
        with:
          name: ronin-pleias-pd-shards-manifest
          path: /tmp/ronin-pleias-pd/manifest.json
          if-no-files-found: error
          retention-days: 30
