name: Auditoría de descargas reales del corpus

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/prepare_open_corpora.py"
      - "scripts/acquire_cryptography_library.py"
      - "scripts/build_obfuscation_cases.py"
      - "ronin/epistemic/obfuscation.py"
      - "tests/test_epistemic_obfuscation.py"
      - "tests/test_build_obfuscation_cases.py"
      - "tests/test_acquire_cryptography_library.py"
      - "docs/CASOS_CODIFICACION_DOCUMENTADA.md"
      - ".github/workflows/corpus-acquisition-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corpus-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acquire-and-audit:
    name: Descargar y verificar bibliotecas abiertas
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Descargar archivos originales sin credenciales y preparar corpus
        run: |
          python scripts/prepare_open_corpora.py \
            --output /tmp/ronin-open-corpus/processed \
            --cache-dir /tmp/ronin-open-corpus/cache
      - name: Comprobar manifiesto, fuentes y particiones
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("/tmp/ronin-open-corpus/processed")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          assert manifest["document_count"] >= 100
          assert len(manifest["sources"]) == 3
          assert all(manifest["source_document_counts"][key] > 0 for key in (
              "cligs-textbox", "cligs-conssa", "eltec-spa"
          ))
          assert set(manifest["document_counts"]) == {"train", "validation", "test"}
          rows = [json.loads(line) for line in (root / "documents.jsonl").read_text(encoding="utf-8").splitlines()]
          assert len(rows) == manifest["document_count"]
          assert {row["partition"] for row in rows} == {"train", "validation", "test"}
          assert all(
              row["source_id"]
              and row["source_revision"]
              and row["license_text"]
              and len(row["source_file_sha256"]) == 64
              for row in rows
          )
          assert sum(manifest["document_counts"].values()) == manifest["document_count"]
          assert all(len(value) == 64 for value in manifest["output_sha256"].values())
          for name in ("train.txt", "validation.txt", "test.txt"):
              assert (root / name).is_file() and (root / name).stat().st_size > 0
          print(json.dumps({
              "document_count": manifest["document_count"],
              "source_document_counts": manifest["source_document_counts"],
              "document_counts": manifest["document_counts"],
              "source_downloads": {
                  item["id"]: {
                      "tree_sha": item["tree_sha"],
                      "downloaded_file_count": item["downloaded_file_count"],
                      "downloaded_files_sha256": item["downloaded_files_sha256"],
                  }
                  for item in manifest["sources"]
              },
              "output_sha256": manifest["output_sha256"],
              "skipped_count": manifest["skipped_count"],
          }, ensure_ascii=False, indent=2))
          PY
      - name: Publicar corpus literario como artefacto auditable
        uses: actions/upload-artifact@v4
        with:
          name: ronin-bibliotecas-adquiridas
          path: |
            /tmp/ronin-open-corpus/processed/manifest.json
            /tmp/ronin-open-corpus/processed/documents.jsonl
          if-no-files-found: error
          retention-days: 30

      - name: Publicar particiones de texto preparadas (retención temporal)
        uses: actions/upload-artifact@v4
        with:
          name: ronin-corpus-v2-particiones
          path: |
            /tmp/ronin-open-corpus/processed/train.txt
            /tmp/ronin-open-corpus/processed/validation.txt
            /tmp/ronin-open-corpus/processed/test.txt
          if-no-files-found: error
          retention-days: 7

  acquire-cryptography-library:
    name: Descargar y construir biblioteca de codificación
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Descargar seis fuentes primarias sin credenciales
        run: |
          python scripts/acquire_cryptography_library.py --output-dir /tmp/ronin-cryptography-library
      - name: Construir y validar pares de opacidad
        run: |
          PYTHONPATH=. python scripts/build_obfuscation_cases.py \
            --source-manifest /tmp/ronin-cryptography-library/manifest.json \
            --output /tmp/ronin-obfuscation-library/cases.jsonl \
            --noise-count 500
          python - <<'PY'
          import json
          from pathlib import Path
          from ronin.epistemic.obfuscation import validate_obfuscation_case

          source_root = Path("/tmp/ronin-cryptography-library")
          source_manifest = json.loads((source_root / "manifest.json").read_text(encoding="utf-8"))
          assert source_manifest["credential_free"] is True
          assert source_manifest["source_count"] == 6
          for source in source_manifest["sources"]:
              assert source["training_status"] == "excluded_pending_manual_review"
              assert len(source["sha256"]) == 64
              assert (source_root / source["local_filename"]).is_file()

          root = Path("/tmp/ronin-obfuscation-library")
          rows = [json.loads(line) for line in (root / "cases.jsonl").read_text(encoding="utf-8").splitlines()]
          errors = [(row["record_id"], validate_obfuscation_case(row)) for row in rows]
          errors = [(record_id, error) for record_id, messages in errors for error in messages]
          assert not errors, errors[:10]
          summary = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          assert summary["counts_by_type"]["B"] == 500
          assert summary["counts_by_label"]["NO_MESSAGE_IN_CONTROL"] == 500
          assert summary["counts_by_type"]["A"] >= 3
          assert summary["counts_by_type"]["C"] >= 1
          assert summary["counts_by_type"]["D"] >= 1
          print(json.dumps({
              "source_count": source_manifest["source_count"],
              "source_sizes": {item["id"]: item["size_bytes"] for item in source_manifest["sources"]},
              "dataset": summary,
          }, ensure_ascii=False, indent=2))
          PY
      - name: Publicar fuentes primarias y pares de opacidad
        uses: actions/upload-artifact@v4
        with:
          name: ronin-biblioteca-opacidad-v1
          path: |
            /tmp/ronin-cryptography-library/
            /tmp/ronin-obfuscation-library/
          if-no-files-found: error
          retention-days: 30
