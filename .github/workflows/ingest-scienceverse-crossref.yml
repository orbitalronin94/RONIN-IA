name: Acquire ScienceVerse eLife and Frontiers with Crossref license verification
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ingest-scienceverse-crossref.yml"
      - "scripts/ingest_scienceverse_crossref.py"
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: ronin-scienceverse-crossref
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Verify per-DOI CC-BY-4.0 through Crossref and acquire full text
        run: python scripts/ingest_scienceverse_crossref.py
      - name: Commit audited candidate packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/datasets/candidates/scienceverse-crossref-verified
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: add Crossref-verified ScienceVerse candidate texts"
          for attempt in $(seq 1 24); do
            pending=$(gh run list --workflow run-ledger.yml --limit 30 --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "pending")] | length')
            if [ "$pending" = "0" ]; then
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
            fi
            sleep 5
          done
          echo "Unable to push Crossref-verified candidate package" >&2
          exit 1
