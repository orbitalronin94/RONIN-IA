name: RONIN — verificar Papers para train scoped
on:
  push:
    branches: [main]
    paths:
      - "scripts/verify_ronin_authored_papers_training.py"
      - "data/datasets/admitted/ronin-authored-papers-v1/**"
      - ".github/workflows/verify-papers-training.yml"
  workflow_dispatch:
permissions:
  actions: read
  contents: read
concurrency:
  group: ronin-papers-train-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts
            data/datasets/admitted/ronin-authored-papers-v1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Download exact admitted train partitions for comparison
        uses: actions/download-artifact@v7
        with:
          name: ronin-admitted-literature-es-v1-train
          path: incoming/literature
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 41926088900
      - uses: actions/download-artifact@v7
        with:
          name: ronin-admitted-mathlib4-v1
          path: incoming/mathlib4
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 42026633643
      - uses: actions/download-artifact@v7
        with:
          name: ronin-nasa-ntrs-file-reviewed-train
          path: incoming/nasa
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 42028138060
      - name: Verify every Papers payload and exact cross-source dedup
        run: |
          python scripts/verify_ronin_authored_papers_training.py \
            --manifest data/datasets/admitted/ronin-authored-papers-v1/manifest.json \
            --documents-dir data/datasets/admitted/ronin-authored-papers-v1/documents \
            --literature-jsonl incoming/literature/documents.train.jsonl \
            --mathlib-jsonl-gz incoming/mathlib4/documents.train.jsonl.gz \
            --nasa-jsonl incoming/nasa/documents.train.jsonl \
            --report reports/papers-train-audit.json
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ronin-papers-train-audit-${{ github.run_id }}
          path: reports/papers-train-audit.json
          if-no-files-found: warn
          retention-days: 90
