name: Build Ronin IA APK

# Decisión: compilar en CI evita exigir Android Studio en el equipo del desarrollador.
# Se cancela un build antiguo si llega un commit nuevo a la misma rama.

on:
  workflow_dispatch:
  push:
    branches: [main, master]

concurrency:
  group: ronin-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Las herramientas se fijan a versiones mayores conocidas para builds reproducibles.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      # Ejecutar contratos estáticos de seguridad y arranque antes de compilar Android.
      - name: Test frontend contracts
        run: npm test
      # Detectar errores reales de sintaxis antes de pagar el coste de Gradle.
      - name: Validate frontend JavaScript syntax
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const html = readFileSync('www/index.html', 'utf8');
          const match = html.match(/<script type="module">([\s\S]*?)<\/script>/);
          if (!match) throw new Error('No module script found in www/index.html');
          writeFileSync('/tmp/ronin-frontend-check.mjs', match[1]);
          NODE
          node --check /tmp/ronin-frontend-check.mjs
      # Empaquetar los pesos cuantizados dentro de www para que Android no los descargue al primer uso.
      # q4f16 sirve para WebGPU; q8 permite el fallback CPU. La APK crecerá aproximadamente 1.2 GB antes de compresión.
      - name: Download bundled Qwen3 model weights
        run: |
          python3 -m pip install --disable-pip-version-check huggingface_hub
          python3 - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id='onnx-community/Qwen3-0.6B-ONNX',
              local_dir='www/models/onnx-community/Qwen3-0.6B-ONNX',
              allow_patterns=[
                  'config.json', 'generation_config.json', 'tokenizer.json',
                  'tokenizer_config.json', 'special_tokens_map.json',
                  'onnx/model_q4f16.onnx', 'onnx/model_quantized.onnx',
              ],
          )
          PY
          test -s www/models/onnx-community/Qwen3-0.6B-ONNX/onnx/model_q4f16.onnx
          test -s www/models/onnx-community/Qwen3-0.6B-ONNX/onnx/model_quantized.onnx
      # El proyecto Android se genera en CI para mantener ligera la base fuente.
      - run: npx cap add android
      - run: npx cap sync android
      # INTERNET es un permiso normal de Android (no muestra diálogo); declararlo explícitamente habilita CDN y descarga del modelo.
      - name: Ensure Android network permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          marker = '    <application'
          if marker not in s:
              raise SystemExit('No se encontró <application> en AndroidManifest.xml')
          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />',
          ]
          for permission in permissions:
              if permission not in s:
                  s = s.replace(marker, permission + '\n' + marker, 1)
          p.write_text(s)
          print('Permisos de red verificados en AndroidManifest.xml')
          PY
      - run: chmod +x android/gradlew
      - run: cd android && ./gradlew --no-daemon assembleDebug
      # Artefacto de depuración temporal; no es una release firmada para Play Store.
      - uses: actions/upload-artifact@v4
        with:
          name: ronin-ia-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
