name: Build Ronin IA APK

# Decisión: compilar en CI evita exigir Android Studio en el equipo del desarrollador.
# Se cancela un build antiguo si llega un commit nuevo a la misma rama.

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/build-android.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'scripts/prepare-models.mjs'
      - 'www/**'
      - 'assets/**'
      - 'tests/**'
  pull_request:
    branches: [main, master]
    paths:
      - '.github/workflows/build-android.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'scripts/prepare-models.mjs'
      - 'www/**'
      - 'assets/**'
      - 'tests/**'

concurrency:
  group: ronin-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # Las herramientas se fijan a versiones mayores conocidas para builds reproducibles.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      # Ejecutar contratos estáticos de seguridad y arranque antes de compilar Android.
      - name: Test frontend contracts
        run: npm test
      # Detectar errores reales de sintaxis antes de pagar el coste de Gradle.
      - name: Validate frontend JavaScript syntax
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const html = readFileSync('www/index.html', 'utf8');
          const match = html.match(/<script type="module">([\s\S]*?)<\/script>/);
          if (!match) throw new Error('No module script found in www/index.html');
          writeFileSync('/tmp/ronin-frontend-check.mjs', match[1]);
          NODE
          node --check /tmp/ronin-frontend-check.mjs
          node --check www/router.js
          node --check www/experts.js
          node --check scripts/prepare-models.mjs
      # Copiar el runtime JS y los archivos ONNX al paquete de la app: el APK no dependerá de una CDN.
      - name: Bundle local inference runtime
        run: |
          mkdir -p www/vendor www/models/onnx-community/Qwen3-0.6B-ONNX
          npx esbuild node_modules/@huggingface/transformers/src/transformers.js --bundle --format=esm --platform=browser --target=es2022 --outfile=www/vendor/transformers.js
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          root = Path('node_modules')
          dest = Path('www/vendor')
          # ONNX Runtime Web ships WASM binaries separately from its JS bundle.
          candidates = list(root.glob('onnxruntime-web/dist/*.wasm')) + list(root.glob('@huggingface/transformers/dist/*.wasm'))
          if not candidates:
              raise SystemExit('No se encontraron binarios WASM de ONNX Runtime Web; no se puede afirmar que la APK sea offline.')
          for f in candidates:
              shutil.copy2(f, dest / f.name)
          print(f'WASM assets copied: {len(candidates)}')
          PY
      - name: Download all bundled model weights
        run: npm run prepare:models
      - name: Prepare Ronin app icon
        run: |
          mkdir -p assets
          cp www/assets/ronin-logo.svg assets/icon.svg
      # El proyecto Android se genera en CI para mantener ligera la base fuente.
      - run: npx cap add android
      - name: Generate Android launcher icon from Ronin logo
        run: npx @capacitor/assets generate --android --assetPath assets --iconBackgroundColor '#07111f' --iconBackgroundColorDark '#07111f'
      - run: npx cap sync android
      # INTERNET es un permiso normal de Android. El runtime y el modelo se empaquetan; las funciones web externas opcionales siguen necesitando conexión.
      - name: Ensure Android network permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          marker = '    <application'
          if marker not in s:
              raise SystemExit('No se encontró <application> en AndroidManifest.xml')
          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />',
          ]
          for permission in permissions:
              if permission not in s:
                  s = s.replace(marker, permission + '\n' + marker, 1)
          p.write_text(s)
          print('Permisos de red verificados en AndroidManifest.xml')
          PY
      - run: chmod +x android/gradlew
      # El empaquetado del modelo ONNX consume mucha memoria al comprimir assets.
      # Fijar heap explícito evita que Gradle falle con "Java heap space".
      - name: Configure Gradle memory
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/gradle.properties')
          lines = p.read_text().splitlines() if p.exists() else []
          settings = {
              # Model ONNX assets are very large; keep Gradle's heap and worker count explicit.
              'org.gradle.jvmargs': '-Xmx6g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8',
              'org.gradle.workers.max': '1',
              'org.gradle.parallel': 'false',
              'android.useAndroidX': 'true',
              'android.enableJetifier': 'true',
          }
          for key, value in settings.items():
              prefix = key + '='
              lines = [line for line in lines if not line.startswith(prefix)]
              lines.append(prefix + value)
          p.write_text('\n'.join(lines) + '\n')
          print('Gradle heap and AndroidX settings configured')
          PY
      - name: Verify AndroidX Gradle setting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/gradle.properties')
          lines = p.read_text().splitlines() if p.exists() else []
          lines = [line for line in lines if not line.startswith('android.useAndroidX=')]
          lines.append('android.useAndroidX=true')
          p.write_text('\n'.join(lines) + '\n')
          actual = [line for line in p.read_text().splitlines() if line.startswith('android.useAndroidX=')]
          print('Effective AndroidX setting:', actual)
          if actual != ['android.useAndroidX=true']:
              raise SystemExit('android.useAndroidX was not persisted')
          PY
      - run: cd android && ./gradlew --no-daemon assembleDebug
      # No basta con que Gradle termine: verificar que el APK contiene pesos, runtime y WASM y registrar tamaño/hash.
      - name: Verify APK model assets and fingerprint
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib
          apk = Path('android/app/build/outputs/apk/debug/app-debug.apk')
          if not apk.is_file() or apk.stat().st_size == 0:
              raise SystemExit('APK inexistente o vacía')
          with ZipFile(apk) as z:
              names = z.namelist()
          required = [
              'Qwen3-0.6B-ONNX/onnx/model_q4.onnx',
              'Qwen2.5-Coder-0.5B-Instruct/onnx/model_q4.onnx',
          ]
          for suffix in required:
              matches = [n for n in names if n.endswith(suffix)]
              if not matches:
                  raise SystemExit(f'FALTA en APK: {suffix}')
              print(f'OK modelo: {matches[0]}')
          runtime = [n for n in names if n.endswith('/vendor/transformers.js')]
          wasm = [n for n in names if n.endswith('.wasm') and '/vendor/' in n]
          if not runtime:
              raise SystemExit('FALTA runtime local vendor/transformers.js en APK')
          if not wasm:
              raise SystemExit('FALTAN binarios WASM de ONNX Runtime en APK')
          print(f'OK runtime JS: {runtime[0]}')
          print(f'OK binarios WASM: {len(wasm)}')
          digest = hashlib.sha256()
          with apk.open('rb') as f:
              for chunk in iter(lambda: f.read(8 * 1024 * 1024), b''):
                  digest.update(chunk)
          print(f'APK_BYTES={apk.stat().st_size}')
          print(f'APK_SHA256={digest.hexdigest()}')
          PY
      # Artefacto de depuración temporal; no es una release firmada para Play Store.
      - uses: actions/upload-artifact@v4
        with:
          name: ronin-ia-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
