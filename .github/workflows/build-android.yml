name: Build Ronin IA APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

concurrency:
  group: ronin-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - name: Validate frontend JavaScript syntax
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const html = readFileSync('www/index.html', 'utf8');
          const match = html.match(/<script type="module">([\s\S]*?)<\/script>/);
          if (!match) throw new Error('No module script found in www/index.html');
          writeFileSync('/tmp/ronin-frontend-check.mjs', match[1]);
          NODE
          node --check /tmp/ronin-frontend-check.mjs
      - run: npx cap add android
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - run: cd android && ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ronin-ia-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
