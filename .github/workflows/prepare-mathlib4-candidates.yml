name: Preparar candidatos matemáticos — Lean mathlib4

on:
  push:
    branches: [main]
    paths:
      - scripts/prepare_mathlib4_records.py
      - data/manifests/mathlib4_source.json
      - .github/workflows/prepare-mathlib4-candidates.yml
  schedule:
    - cron: "23 5 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ronin-mathlib4-candidate-ingestion
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout RONIN
        uses: actions/checkout@v5
      - name: Checkout pinned mathlib4 source
        uses: actions/checkout@v5
        with:
          repository: leanprover-community/mathlib4
          ref: a84939a26903163e1b98ee002bc94e9563e75c12
          path: external/mathlib4
          fetch-depth: 1
          persist-credentials: false
      - name: Prepare Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Verify immutable revision and prepare candidate JSONL
        run: |
          test "$(git -C external/mathlib4 rev-parse HEAD)" = "a84939a26903163e1b98ee002bc94e9563e75c12"
          python scripts/prepare_mathlib4_records.py \
            --repo-root external/mathlib4 \
            --revision "a84939a26903163e1b98ee002bc94e9563e75c12" \
            --output data/staging/lean_mathlib_records.jsonl \
            --report reports/mathlib4-ingestion.json
      - name: Validate provenance, license and JSONL
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("reports/mathlib4-ingestion.json").read_text(encoding="utf-8"))
          path = Path("data/staging/lean_mathlib_records.jsonl")
          assert report["source_revision"] == "a84939a26903163e1b98ee002bc94e9563e75c12"
          assert report["repository_license"] == "Apache-2.0"
          assert report["records"] > 0
          assert report["training_eligible"] is False
          assert report["admitted"] is False
          rows = 0
          domains = set()
          for line in path.open(encoding="utf-8"):
              row = json.loads(line)
              assert row["source_dataset"] == "leanprover-community/mathlib4"
              assert row["source_revision"] == "a84939a26903163e1b98ee002bc94e9563e75c12"
              assert row["license"] == "Apache-2.0"
              assert row["provenance"].startswith("https://github.com/leanprover-community/mathlib4/blob/a84939a26903163e1b98ee002bc94e9563e75c12/")
              assert row["domain"] in {"mathematics", "logic_epistemology"}
              assert row["text"]
              rows += 1
              domains.add(row["domain"])
          assert rows == report["records"]
          assert domains == {"mathematics", "logic_epistemology"}
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
      - name: Publish candidate source artifact (not training-admitted)
        uses: actions/upload-artifact@v6
        with:
          name: ronin-mathlib4-candidate-records
          path: |
            data/staging/lean_mathlib_records.jsonl
            reports/mathlib4-ingestion.json
          if-no-files-found: error
          retention-days: 90
      - name: Link run ledger
        if: always()
        uses: ./.github/actions/run-ledger-link
