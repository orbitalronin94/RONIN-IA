name: Prepare filtered Common Corpus candidates

on:
  push:
    branches: [main]
    paths:
      - "scripts/ingest_common_corpus_filtered.py"
      - ".github/workflows/prepare-common-corpus-filtered.yml"
  workflow_dispatch:
    inputs:
      max_scan:
        description: Maximum rows to inspect from the pinned streaming snapshot
        required: false
        default: "20000"
      max_export:
        description: Maximum accepted candidate rows
        required: false
        default: "3000"
  schedule:
    - cron: "37 5 11 * *"

permissions:
  contents: read

jobs:
  filter:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install pinned streaming dependencies
        run: python -m pip install "datasets==3.3.2" "huggingface_hub==0.29.3"
      - name: Filter exact per-document licenses and export candidate shards
        run: |
          python scripts/ingest_common_corpus_filtered.py --max-scan "${{ inputs.max_scan || '20000' }}" --max-export "${{ inputs.max_export || '3000' }}"
      - uses: actions/upload-artifact@v6
        with:
          name: ronin-common-corpus-filtered-candidates
          path: artifacts/common-corpus/
          if-no-files-found: error
          retention-days: 90
