name: RONIN — checks del torneo de checkpoints
on:
  pull_request:
    paths:
      - "ronin/data/source_batches.py"
      - "ronin/training/loop.py"
      - "scripts/run_checkpoint_tournament.py"
      - "tests/test_source_batches.py"
      - ".github/workflows/checkpoint-tournament-tests.yml"
jobs:
  static-and-sampler-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          python -m pip install -e . --no-deps "numpy>=1.26"
      - name: Compile implementation
        run: python -m compileall -q ronin scripts/run_checkpoint_tournament.py scripts/evaluate_mmlu_pro.py scripts/evaluate_text.py
      - name: Test source sampler
        run: python -m unittest discover -s tests -p "test_source_batches.py" -v
