name: ParlaIbero-ES audit documents preflight

on:
  push:
    branches: [main]
    paths:
      - "scripts/download_parlaibero_audit_docs.py"
      - ".github/workflows/download-parlaibero-audit-docs.yml"
  pull_request:
    paths:
      - "scripts/download_parlaibero_audit_docs.py"
      - ".github/workflows/download-parlaibero-audit-docs.yml"
      - "scripts/preflight_parlaibero_dataverse.py"
      - ".github/workflows/preflight-parlaibero-dataverse.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Download and hash pinned small audit documents
        run: python scripts/download_parlaibero_audit_docs.py
      - uses: actions/upload-artifact@v6
        with:
          name: ronin-parlaibero-es-v2-audit-documents
          path: artifacts/parlaibero-audit/
          if-no-files-found: error
          retention-days: 90
