name: Verify Eulogikon CC0 metadata source

on:
  push:
    paths:
      - "scripts/ingest_eulogikon_metadata.py"
      - "scripts/validate_rights_registry.py"
      - "scripts/validate_github_source_audit.py"
      - "data/datasets/rights_registry/schema.json"
      - "data/datasets/candidates/github-source-audit.json"
      - ".github/workflows/verify-eulogikon-metadata.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch pinned metadata and verify rights scope and hashes
        run: python scripts/ingest_eulogikon_metadata.py
      - name: Validate repository rights ledger and GitHub source audit
        run: |
          python scripts/validate_rights_registry.py --record artifacts/eulogikon/rights-record.candidate.json
          python scripts/validate_github_source_audit.py
      - name: Upload reproducible metadata candidate and rights record
        uses: actions/upload-artifact@v4
        with:
          name: ronin-eulogikon-metadata-level-a-candidate
          path: artifacts/eulogikon/
          if-no-files-found: error
          retention-days: 90
