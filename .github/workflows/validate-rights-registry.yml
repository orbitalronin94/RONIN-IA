name: Validate rights registry

on:
  push:
    branches: [main]
    paths:
      - "data/datasets/rights_registry/**"
      - "scripts/validate_rights_registry.py"
      - "tests/test_rights_registry.py"
      - ".github/workflows/validate-rights-registry.yml"
  pull_request:
    paths:
      - "data/datasets/rights_registry/**"
      - "scripts/validate_rights_registry.py"
      - "tests/test_rights_registry.py"
      - ".github/workflows/validate-rights-registry.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate item/version rights ledger
        run: python scripts/validate_rights_registry.py
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run rights policy tests
        run: python -m pytest -q tests/test_rights_registry.py
