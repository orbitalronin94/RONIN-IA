name: Validate dataset rights registry

on:
  push:
    branches: [main]
    paths:
      - "data/datasets/rights_registry/**"
      - "scripts/validate_rights_registry.py"
      - ".github/workflows/validate-rights-registry.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validate item-level rights evidence
        run: python scripts/validate_rights_registry.py
      - name: Publish explicit level-A count
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows = [json.loads(x) for x in Path("data/datasets/rights_registry/records.jsonl").read_text().splitlines() if x.strip()]
          level_a = sum(x.get("rights_level") == "A" for x in rows)
          print(f"Rights level A records: {level_a}")
          print("An empty registry is valid but means zero level-A records.")
          PY
