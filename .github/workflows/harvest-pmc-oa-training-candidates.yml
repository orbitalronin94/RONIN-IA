name: Harvest PMC OA CC0 and CC-BY corpus

on:
  push:
    branches: [main]
    paths:
      - "scripts/harvest_pmc_oa_cc0_ccby.py"
      - ".github/workflows/harvest-pmc-oa-training-candidates.yml"
  workflow_dispatch:
    inputs:
      max_text_gib:
        description: Maximum UTF-8 article text to add in this run (GiB)
        required: true
        default: "2"
        type: string
  schedule:
    - cron: "23 2 * * 1"

permissions:
  contents: write

concurrency:
  group: pmc-oa-corpus-harvest
  cancel-in-progress: true

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout only corpus harvester paths
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scripts/harvest_pmc_oa_cc0_ccby.py
            scripts/verify_pmc_oa_candidate_corpus.py
            data/datasets/candidates/pmc-oa-cc0-ccby-v2

      - name: Check first one-percent milestone
        id: gate
        run: |
          python scripts/verify_pmc_oa_candidate_corpus.py
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          p = Path("data/datasets/candidates/pmc-oa-cc0-ccby-v2/corpus-verification.json")
          data = json.loads(p.read_text()) if p.exists() else {}
          print("complete=" + str(bool(data.get("one_percent_milestone_reached"))).lower())
          print("verified_text_bytes=" + str(data.get("unique_utf8_text_bytes", 0)))
          PY

      - name: Harvest license-verified full text
        if: steps.gate.outputs.complete != 'true'
        env:
          MAX_TEXT_GIB: ${{ inputs.max_text_gib || '2' }}
        run: |
          case "$MAX_TEXT_GIB" in
            ''|*[!0-9]*) echo "max_text_gib must be an integer"; exit 2 ;;
          esac
          if [ "$MAX_TEXT_GIB" -lt 1 ] || [ "$MAX_TEXT_GIB" -gt 2 ]; then
            echo "Allowed range is 1-2 GiB per run"; exit 2
          fi
          python scripts/harvest_pmc_oa_cc0_ccby.py \
            --max-text-bytes "$((MAX_TEXT_GIB * 1024 * 1024 * 1024))" \
            --max-candidates 50000 \
            --workers 12

      - name: Verify corpus hashes and byte totals
        if: steps.gate.outputs.complete != 'true'
        run: python scripts/verify_pmc_oa_candidate_corpus.py

      - name: Commit corpus shards and provenance to main
        if: steps.gate.outputs.complete != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/datasets/candidates/pmc-oa-cc0-ccby-v2
          if git diff --cached --quiet; then
            echo "No new eligible PMC documents in this run."
            exit 0
          fi
          git commit -m "Add license-screened PMC OA text corpus batch"
          git fetch --deepen=1000 origin main
          git rebase origin/main
          git push origin HEAD:main
