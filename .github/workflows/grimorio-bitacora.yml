name: Bitácora automática del Grimorio

on:
  workflow_run:
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

concurrency:
  group: grimorio-bitacora
  cancel-in-progress: false

jobs:
  append-chronicle:
    if: github.event.workflow_run.name != 'Bitácora automática del Grimorio'
    runs-on: ubuntu-latest
    steps:
      - name: Añadir acta de ejecución al Grimorio
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'docs/GRIMORIO_DE_DROSOPHILA.md';

            const clean = (value) => String(value ?? 'no consta')
              .replace(/[|\r\n]/g, ' ')
              .replace(/\s+/g, ' ')
              .trim();

            const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({
              owner, repo, run_id: run.id, per_page: 100
            });

            const artifactText = artifacts.artifacts.length
              ? artifacts.artifacts.map(a =>
                  `\u0060${clean(a.name)}\u0060 (${(a.size_in_bytes / 1048576).toFixed(2)} MiB${a.expired ? ', expirado' : ''})`
                ).join('; ')
              : 'Ningún artefacto registrado';

            const entry = [
              '',
              `### Run #${run.run_number} — ${clean(run.name)}`,
              '',
              `- Run ID: \`${run.id}\``,
              `- Estado: **${clean(run.conclusion || run.status)}**`,
              `- Rama: \`${clean(run.head_branch)}\``,
              `- Evento: \`${clean(run.event)}\``,
              `- Commit: [\`${String(run.head_sha || '').slice(0, 12)}\`](https://github.com/${owner}/${repo}/commit/${run.head_sha})`,
              `- Actor: ${clean(run.actor?.login)}`,
              `- Intento: ${clean(run.run_attempt)}`,
              `- Artefactos: ${artifactText}`,
              `- Acta: [abrir ejecución](${run.html_url})`,
              '',
              '> El escribano certifica que la ejecución terminó; no certifica que el modelo haya aprendido.',
              ''
            ].join('\n');

            let current;
            try {
              const response = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
              current = response.data;
            } catch (error) {
              if (error.status !== 404) throw error;
              throw new Error(`No se halló el libro en ${path}: ${error.message}`);
            }

            const decoded = Buffer.from(current.content, 'base64').toString('utf8');
            const marker = `Run ID: \`${run.id}\``;
            if (decoded.includes(marker)) {
              core.info(`El run ${run.id} ya consta; no se duplica el acta.`);
              return;
            }

            const endMarker = '<!-- GRIMORIO_AUTO_LOG:END -->';
            if (!decoded.includes(endMarker)) {
              throw new Error('No se halló el marcador final de la bitácora automática.');
            }

            const updated = decoded.replace(endMarker, `${entry}\n${endMarker}`);
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path,
              message: `chronicle: record completed Actions run ${run.id}`,
              content: Buffer.from(updated, 'utf8').toString('base64'),
              sha: current.sha,
              branch: 'main'
            });
            core.info(`Acta añadida para el run ${run.id}.`);
