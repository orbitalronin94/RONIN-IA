name: Materialize admitted datasets

on:
  push:
    paths:
      - ".github/workflows/materialize-admitted-datasets.yml"
      - "scripts/materialize_admitted_literature.py"
      - "data/datasets/admitted/literature-es-v1/manifest.json"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ronin-admitted-datasets
  cancel-in-progress: false

jobs:
  literature-es-v1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download pinned corpus artifact
        uses: actions/download-artifact@v4
        with:
          name: ronin-corpus-v2-particiones
          path: incoming/corpus
          repository: orbitalronin94/RONIN-IA
          run-id: 41825919840
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download pinned document provenance
        uses: actions/download-artifact@v4
        with:
          name: ronin-bibliotecas-adquiridas
          path: incoming/provenance
          repository: orbitalronin94/RONIN-IA
          run-id: 41825919840
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify and materialize train partition only
        run: |
          python scripts/materialize_admitted_literature.py \
            --corpus-dir incoming/corpus \
            --provenance-dir incoming/provenance \
            --output-dir materialized/literature-es-v1

      - name: Publish train-only dataset artifact
        uses: actions/upload-artifact@v4
        with:
          name: ronin-admitted-literature-es-v1-train
          path: materialized/literature-es-v1/
          if-no-files-found: error
          retention-days: 90
