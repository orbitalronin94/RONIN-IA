name: RONIN — tutor MoE local Qwen3 30B-A3B

on:
  workflow_dispatch:
    inputs:
      prompts_jsonl:
        description: "Ruta opcional a JSONL versionado con objetos {id,prompt}; vacío = solo smoke test"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ronin-local-moe-tutor
  cancel-in-progress: false

jobs:
  tutor-cpu:
    # Runner propio: los runners hosted estándar no garantizan RAM/disco para un GGUF de 18.6 GB.
    runs-on: [self-hosted, linux, x64, ronin-32gb-cpu]
    timeout-minutes: 720
    env:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_MODELS: ${{ runner.tool_cache }}/ronin-ollama-models
      TUTOR_MODEL: hf.co/Qwen/Qwen3-30B-A3B-GGUF:Q4_K_M
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Check CPU runner memory and disk budget
        shell: bash
        run: |
          set -euo pipefail
          mem_kib=$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)
          mem_gib=$((mem_kib / 1024 / 1024))
          disk_gib=$(df -BG "${{ runner.tool_cache }}" | awk 'NR==2 {gsub("G","",$4); print $4}')
          echo "Available RAM: ${mem_gib} GiB; available disk: ${disk_gib} GiB"
          test "$mem_gib" -ge 28 || { echo "::error::Need at least 28 GiB available RAM for Q4 MoE inference."; exit 1; }
          test "$disk_gib" -ge 55 || { echo "::error::Need at least 55 GiB free disk for weights, runtime and scratch."; exit 1; }
          mkdir -p "$OLLAMA_MODELS"
      - name: Install Ollama CPU runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version
      - name: Start local Ollama server
        shell: bash
        run: |
          set -euo pipefail
          nohup ollama serve > ollama-server.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -fsS "$OLLAMA_HOST/api/tags" >/dev/null; then exit 0; fi
            sleep 5
          done
          cat ollama-server.log
          exit 1
      - name: Download pinned tutor quantization
        shell: bash
        run: |
          set -euo pipefail
          ollama pull "$TUTOR_MODEL"
          ollama list
          df -h "$OLLAMA_MODELS"
      - name: CPU inference smoke test
        shell: bash
        run: |
          set -euo pipefail
          ollama run "$TUTOR_MODEL" "Responde en español en una frase: ¿qué es una prueba de regresión?"
      - name: Generate local teacher traces (optional)
        if: ${{ inputs.prompts_jsonl != '' }}
        run: |
          python scripts/run_local_moe_tutor.py \
            --model "$TUTOR_MODEL" \
            --prompts "${{ inputs.prompts_jsonl }}" \
            --output reports/tutor-traces.jsonl
      - name: Record tutor provenance
        if: always()
        shell: bash
        run: |
          mkdir -p reports
          python - <<'PY'
          import json, os, pathlib, subprocess
          model=os.environ["TUTOR_MODEL"]
          result=subprocess.run(["ollama","show",model],capture_output=True,text=True)
          pathlib.Path("reports/tutor-model.txt").write_text(result.stdout or result.stderr,encoding="utf-8")
          manifest={
            "model": model,
            "upstream": "https://huggingface.co/Qwen/Qwen3-30B-A3B-GGUF",
            "quantization": "Q4_K_M",
            "parameters_total": 30_500_000_000,
            "parameters_active_per_token": 3_300_000_000,
            "runtime": "Ollama / llama.cpp CPU",
            "teacher_outputs_are_training_eligible": False,
            "admission": "Requires independent validation, provenance and explicit promotion; never mix raw tutor output into training automatically."
          }
          pathlib.Path("reports/tutor-manifest.json").write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Upload trace and provenance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ronin-qwen3-moe-tutor-${{ github.run_id }}
          path: |
            reports/
            ollama-server.log
          if-no-files-found: warn
          retention-days: 30
