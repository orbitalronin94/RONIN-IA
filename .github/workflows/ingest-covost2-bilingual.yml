name: Ingest CoVoST 2 bilingual CC0 text pairs

on:
  push:
    branches: [main]
    paths:
      - "scripts/ingest_covost2_bilingual_pairs.py"
      - ".github/workflows/ingest-covost2-bilingual.yml"
  workflow_dispatch:
    inputs:
      max_rows:
        description: Maximum bilingual pairs
        required: false
        default: "500000"
  schedule:
    - cron: "53 6 17 * *"

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Export CoVoST sentence/translation pairs
        run: python scripts/ingest_covost2_bilingual_pairs.py --max-rows "500000"
      - name: Validate exact-scope rights candidate
        run: python scripts/validate_rights_registry.py --record artifacts/covost-bilingual/rights-record.candidate.json
      - uses: actions/upload-artifact@v6
        with:
          name: ronin-covost2-bilingual-cc0-candidate
          path: artifacts/covost-bilingual/
          if-no-files-found: error
          retention-days: 90
