name: Build RONIN-IA offline APK (Qwen2.5-0.5B)

on:
  pull_request:
    paths:
      - '.github/workflows/build-offline-apk.yml'
      - 'scripts/bundle-offline-runtime.mjs'
      - 'scripts/prepare-offline-model.mjs'
      - 'www/local-ai.js'
      - 'tests/frontend-contract.test.mjs'
      - 'package.json'
  workflow_dispatch:
    inputs:
      model_revision:
        description: Hugging Face model revision (branch/tag/40-char commit SHA); resolved SHA is recorded in the APK manifest
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: ronin-offline-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install project dependencies
        run: npm install
      - name: Install pinned model runtime and bundler for this build only
        run: npm install --no-save --package-lock=false @huggingface/transformers@3.7.2 esbuild@0.25.0
      - name: Download Qwen2.5-0.5B ONNX q4 assets
        env:
          RONIN_MODEL_REVISION: ${{ inputs.model_revision }}
        run: node scripts/prepare-offline-model.mjs
      - name: Bundle Transformers.js and ONNX Runtime assets locally
        run: node scripts/bundle-offline-runtime.mjs
      - name: Enable bundled offline mode for this APK only
        run: printf '%s\n' '// Generated only by build-offline-apk workflow.' 'export const OFFLINE_BUNDLE_ENABLED = true;' > www/offline-build.js
      - name: Run frontend contract tests
        run: npm test
      - name: Validate frontend JavaScript syntax
        run: |
          node --check www/local-ai.js
          node --check www/router.js
          node --check www/remote-ai.js
          node --check scripts/prepare-offline-model.mjs
          node --check scripts/bundle-offline-runtime.mjs
      - name: Add Android platform
        run: npx cap add android
      - name: Generate Android launcher assets
        run: |
          mkdir -p assets
          cp www/assets/ronin-logo.svg assets/icon.svg
          npx @capacitor/assets generate --android --assetPath assets --iconBackgroundColor '#07111f' --iconBackgroundColorDark '#07111f'
      - name: Sync Capacitor assets
        run: npx cap sync android
      - name: Ensure Android network permissions exist (remote mode remains optional)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          marker = '    <application'
          if marker not in s:
              raise SystemExit('No se encontró <application> en AndroidManifest.xml')
          for permission in [
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />',
          ]:
              if permission not in s:
                  s = s.replace(marker, permission + '\n' + marker, 1)
          p.write_text(s)
          PY
      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleDebug
      - name: Record APK size and fingerprint
        run: |
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          p = Path('android/app/build/outputs/apk/debug/app-debug.apk')
          if not p.exists():
              raise SystemExit('No se encontró app-debug.apk')
          print(f'APK bytes: {p.stat().st_size}')
          print(f'APK MiB: {p.stat().st_size / (1024 * 1024):.2f}')
          print(f'SHA-256: {sha256(p.read_bytes()).hexdigest()}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ronin-ia-qwen25-offline-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
