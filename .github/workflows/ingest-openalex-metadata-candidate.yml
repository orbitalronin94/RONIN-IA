name: Ingest OpenAlex public metadata candidate

on:
  workflow_dispatch:
    inputs:
      max_rows:
        description: Maximum metadata records
        required: false
        default: "100000"
      max_shard_mib:
        description: Maximum compressed shard size in MiB
        required: false
        default: "64"
  schedule:
    - cron: "47 4 7 * *"

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build bounded metadata-only candidate from anonymous S3
        run: |
          python scripts/ingest_openalex_public_metadata.py --max-rows "${{ inputs.max_rows || '100000' }}" --max-shard-mib "${{ inputs.max_shard_mib || '64' }}"
      - name: Validate proposed rights record
        run: python scripts/validate_rights_registry.py --record artifacts/openalex/rights-record.candidate.json
      - uses: actions/upload-artifact@v6
        with:
          name: ronin-openalex-metadata-candidate
          path: artifacts/openalex/
          if-no-files-found: error
          retention-days: 90
