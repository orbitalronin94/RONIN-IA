name = "ronin-ia-gateway"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
# Set this to the exact web origin(s) serving Ronin. Android Capacitor uses a different origin;
# native requests may omit Origin. Do not use "*" when enabling browser access.
ALLOWED_ORIGINS = "https://orbitalronin94.github.io"
MODELS = "openrouter/free,google/gemma-3-4b-it:free,meta-llama/llama-3.3-70b-instruct:free"
APP_URL = "https://github.com/orbitalronin94/RONIN-IA"
